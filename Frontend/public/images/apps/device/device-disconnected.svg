<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="Device disconnected">
  <defs>
    <style>
      .bg { fill: #f3f4f6; }
      .wifi { stroke: #dc2626; stroke-width: 10; fill: none; stroke-linecap: round; }
      .dash { stroke: #ef4444; stroke-width: 4; fill: none; stroke-dasharray: 10 12; }
      .cross { stroke: #dc2626; stroke-width: 12; stroke-linecap: round; }
      .warn { fill: #ffffff; stroke: #ef4444; stroke-width: 3; }
      .warnText { fill: #dc2626; font: 700 28px 'Segoe UI', Arial, sans-serif; }
      .sensorBody { fill: #111827; }
      .sensorRing { fill: none; stroke: #2563eb; stroke-width: 6; }
      .deviceShadow { fill: #d1d5db; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="520"/>

  <path class="wifi" d="M68 46c28-24 76-24 104 0"/>
  <path class="wifi" d="M82 74c20-18 56-18 76 0"/>
  <path class="wifi" d="M98 100c10-9 34-9 44 0"/>
  <circle cx="120" cy="120" r="8" fill="#dc2626"/>

  <path class="dash" d="M120 130 C 160 180, 160 220, 190 260"/>
  <path class="dash" d="M770 130 C 740 170, 700 190, 670 220"/>

  <line class="cross" x1="410" y1="280" x2="550" y2="280"/>
  <line class="cross" x1="480" y1="240" x2="480" y2="320"/>

  <rect class="warn" x="610" y="120" width="300" height="88" rx="14"/>
  <text class="warnText" x="636" y="173">Perte de connexion</text>

  <ellipse class="deviceShadow" cx="245" cy="418" rx="120" ry="18"/>
  <rect x="120" y="280" width="220" height="120" rx="14" fill="#e5e7eb" stroke="#9ca3af"/>
  <rect x="140" y="302" width="96" height="26" rx="4" fill="#1f2937"/>
  <text x="148" y="321" fill="#93c5fd" font-size="12" font-family="Consolas, monospace">24/04/2025 74:53:6</text>
  <rect x="280" y="258" width="44" height="22" rx="10" fill="#1f2937"/>
  <circle cx="312" cy="252" r="12" fill="#2563eb"/>
  <circle cx="306" cy="246" r="6" fill="#1e40af"/>

  <line x1="324" y1="270" x2="405" y2="280" stroke="#111827" stroke-width="12" stroke-linecap="round"/>

  <g transform="translate(648,242)">
    <rect class="sensorBody" x="0" y="24" width="132" height="36" rx="16"/>
    <rect class="sensorBody" x="90" y="18" width="44" height="48" rx="10"/>
    <circle class="sensorRing" cx="20" cy="42" r="16"/>
    <circle cx="20" cy="42" r="6" fill="#2563eb"/>
  </g>
</svg>
