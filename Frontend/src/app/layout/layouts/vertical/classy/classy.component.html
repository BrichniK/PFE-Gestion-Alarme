<!-- Loading bar -->
<fuse-loading-bar></fuse-loading-bar>

<!-- Navigation -->
<fuse-vertical-navigation class="bg-white border-r border-gray-200 print:hidden"
    style="--fuse-vertical-navigation-width: 220px;" [mode]="isScreenSmall ? 'over' : 'side'" [name]="'mainNavigation'"
    [navigation]="navigation.default" [opened]="!isScreenSmall">
    <!-- Navigation header hook -->
    <ng-container fuseVerticalNavigationContentHeader>
        <div class="flex w-full items-center justify-center px-6 py-4">
            <img class="max-w-64" src="images/logo/logo-text.svg" />
        </div>
    </ng-container>
    <!-- Fixed footer -->
    <ng-container fuseVerticalNavigationFooter>
        <div class="border-t border-gray-200 px-4 py-3">
            <div class="flex items-center gap-3">
                <div class="flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-full bg-primary/10">
                    @if (user.avatar) {
                    <img class="h-full w-full rounded-full object-cover" [src]="user.avatar" alt="User avatar" />
                    } @else {
                    <mat-icon class="text-primary icon-size-5" [svgIcon]="'heroicons_solid:user'"></mat-icon>
                    }
                </div>
                <div class="min-w-0 flex-1">
                    <div class="truncate text-base font-semibold text-gray-800">{{ user.name }}</div>
                    <div class="truncate text-sm text-gray-500">{{ user.email }}</div>
                </div>
                <button mat-icon-button class="!text-red-500 hover:!bg-red-50" title="Sign out"
                    (click)="confirmSignOut()">
                    <mat-icon class="icon-size-5" [svgIcon]="'heroicons_outline:arrow-right-on-rectangle'"></mat-icon>
                </button>
            </div>
        </div>
    </ng-container>
</fuse-vertical-navigation>

<!-- Wrapper -->
<div class="flex w-full min-w-0 flex-auto flex-col">
    <!-- Header -->
    <div
        class="bg-card relative z-49 flex h-16 w-full flex-0 items-center px-4 shadow dark:border-b dark:bg-transparent dark:shadow-none md:px-6 print:hidden">
        <!-- Navigation toggle button -->
        <button mat-icon-button (click)="toggleNavigation('mainNavigation')">
            <mat-icon [svgIcon]="'heroicons_outline:bars-3'"></mat-icon>
        </button>
        <!-- Components -->
        <div class="ml-auto flex items-center space-x-0.5 pl-2 sm:space-x-2">
            <languages></languages>
            <fuse-fullscreen class="hidden md:block"></fuse-fullscreen>
            <search [appearance]="'bar'"></search>
            <notifications></notifications>
            <user [showAvatar]="false"></user>
            <!--            <shortcuts></shortcuts>-->
            <!--            <messages></messages>-->
            <!--            <button-->
            <!--                class="lg:hidden"-->
            <!--                mat-icon-button-->
            <!--                (click)="quickChat.toggle()"-->
            <!--            >-->
            <!--                <mat-icon-->
            <!--                    [svgIcon]="'heroicons_outline:chat-bubble-left-right'"-->
            <!--                ></mat-icon>-->
            <!--            </button>-->
        </div>
    </div>

    <!-- Content -->
    <div class="flex flex-auto flex-col">
        <!-- *ngIf="true" hack is required here for router-outlet to work correctly.
             Otherwise, layout changes won't be registered and the view won't be updated! -->
        @if (true) {
        <router-outlet></router-outlet>
        }
    </div>

    <!-- Footer -->

        <span class="font-medium text-secondary">Fuse &copy; {{currentYear}}</span>
    </div>-->
</div>
