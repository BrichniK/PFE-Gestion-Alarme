services:

  frontend:
    image: brichnik/gestion-alarme-pfe:frontend-latest
    container_name: gestion-alarme-frontend


    ports:
      - "80:80"

    depends_on:
      - backend


  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: brichnik/gestion-alarme-pfe:backend-latest
    container_name: gestion-alarme-backend

    ports:
      - "5000:8080"

    environment:

      ASPNETCORE_ENVIRONMENT: Production
      Gemini__ApiKey: ${GEMINI_API_KEY}
      Gemini__Model: gemini-3.1-flash-lite
      Gemini__TimeoutSeconds: 30

      # Connexion vers ta vraie base SQL Server locale
      ConnectionStrings__SqlServerConnection: "Server=host.docker.internal;Database=PFEGestionAlert;User Id=sa;Password=@dmin123;TrustServerCertificate=True"

      # MQTT
      Mqtt__Broker: mosquitto
      Mqtt__Port: 1883
      Mqtt__Username: admincst
      Mqtt__Password: Cst_2024*
      Mqtt__ClientId: CollectManagement-Client
      Mqtt__Topic: "ALARME/+/+"

    depends_on:
      - mosquitto


  mosquitto:
    image: eclipse-mosquitto:2
    container_name: gestion-alarme-mqtt

    ports:
      - "1884:1883"

    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_config:/mosquitto/config



volumes:

  mosquitto_data:
  mosquitto_config: