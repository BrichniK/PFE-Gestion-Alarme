# ASP.NET Core (.NET 8)
# Build + Unit Tests + Coverage + SonarQube + Artifacts

trigger:
- main

pool:
  name: AlertAgent1

variables:
  BuildConfiguration: Release

stages:

# ========================================================
# BACKEND
# ========================================================

- stage: Backend

  displayName: Backend Build

  jobs:

  - job: BuildBackend

    displayName: Build .NET Backend

    steps:

    # ====================================================
    # CHECKOUT
    # ====================================================

    - checkout: self
      clean: true


    # ====================================================
    # JAVA 17
    # ====================================================

    - powershell: |

        $javaHome="C:\Program Files\Eclipse Adoptium\jdk-17.0.20.8-hotspot"

        Write-Host "JAVA_HOME = $javaHome"

        Write-Host "##vso[task.setvariable variable=JAVA_HOME]$javaHome"

        Write-Host "##vso[task.prependpath]$javaHome\bin"

        java -version

      displayName: Configure Java 17


    # ====================================================
    # DOTNET 8
    # ====================================================

    - task: UseDotNet@2

      displayName: Install .NET 8 SDK

      inputs:
        packageType: sdk
        version: 8.x


    # ====================================================
    # ENVIRONMENT CHECK
    # ====================================================

    - powershell: |

        Write-Host "=========================================="
        Write-Host "ENVIRONMENT"
        Write-Host "=========================================="

        Write-Host "JAVA_HOME:"
        Write-Host $env:JAVA_HOME

        Write-Host ""

        Write-Host "Java:"
        java -version

        Write-Host ""

        Write-Host ".NET:"
        dotnet --version

        Write-Host ""

        Write-Host "SDK LIST:"
        dotnet --list-sdks

      displayName: Environment Check


    # ====================================================
    # RESTORE
    # ====================================================

    - task: DotNetCoreCLI@2

      displayName: Restore

      inputs:

        command: restore

        projects: Backend/CST.LePoint.sln


    # ====================================================
    # DEBUG AZURE DEVOPS BRANCH
    # ====================================================

    - powershell: |

        Write-Host ""
        Write-Host "======================================================"
        Write-Host "AZURE DEVOPS BRANCH DEBUG"
        Write-Host "======================================================"

        Write-Host ""
        Write-Host "Build.SourceBranch:"
        Write-Host "$(Build.SourceBranch)"

        Write-Host ""
        Write-Host "Build.SourceBranchName:"
        Write-Host "$(Build.SourceBranchName)"

        Write-Host ""
        Write-Host "Build.SourceVersion:"
        Write-Host "$(Build.SourceVersion)"

        Write-Host ""
        Write-Host "Build.Repository.Name:"
        Write-Host "$(Build.Repository.Name)"

        Write-Host ""
        Write-Host "Build.Repository.Uri:"
        Write-Host "$(Build.Repository.Uri)"

        Write-Host ""
        Write-Host "Build.Repository.Provider:"
        Write-Host "$(Build.Repository.Provider)"

        Write-Host ""
        Write-Host "System.PullRequest.SourceBranch:"
        Write-Host "$(System.PullRequest.SourceBranch)"

        Write-Host ""
        Write-Host "System.PullRequest.TargetBranch:"
        Write-Host "$(System.PullRequest.TargetBranch)"

        Write-Host ""
        Write-Host "======================================================"
        Write-Host "END AZURE DEVOPS BRANCH DEBUG"
        Write-Host "======================================================"

      displayName: DEBUG Azure DevOps Branch


    # ====================================================
    # SONARQUBE PREPARE
    # ====================================================

    - task: SonarQubePrepare@7

      displayName: SonarQube Prepare

      inputs:

        SonarQube: SonarQubeConnection

        scannerMode: dotnet

        projectKey: GestionAlarmePFE

        projectName: GestionAlarmePFE

        extraProperties: |

          sonar.sourceEncoding=UTF-8

          sonar.exclusions=**/bin/**,**/obj/**,**/Migrations/**,**/TestResults/**

          sonar.cs.opencover.reportsPaths=$(Build.SourcesDirectory)/TestResults/**/coverage.opencover.xml

          sonar.cs.vstest.reportsPaths=$(Build.SourcesDirectory)/TestResults/**/*.trx


    # ====================================================
    # DEBUG SONAR GENERATED CONFIGURATION
    # ====================================================

    - powershell: |

        Write-Host ""
        Write-Host "======================================================"
        Write-Host "SONAR GENERATED CONFIGURATION"
        Write-Host "======================================================"

        $sonarConfig = "$(Agent.BuildDirectory)\.sonarqube\out\sonar-project.properties"

        Write-Host ""
        Write-Host "Configuration file:"
        Write-Host $sonarConfig

        if (Test-Path $sonarConfig) {

            Write-Host ""
            Write-Host "======================================================"
            Write-Host "FULL SONAR CONFIGURATION"
            Write-Host "======================================================"

            Get-Content $sonarConfig

            Write-Host ""
            Write-Host "======================================================"
            Write-Host "BRANCH PROPERTIES"
            Write-Host "======================================================"

            $branchProperties = Select-String `
                -Path $sonarConfig `
                -Pattern "sonar.branch|branch.name|sonar.pullrequest" `
                -CaseSensitive:$false `
                -ErrorAction SilentlyContinue

            if ($branchProperties) {

                Write-Host ""
                Write-Host "WARNING: BRANCH PROPERTY FOUND"
                Write-Host ""

                $branchProperties | ForEach-Object {
                    Write-Host $_.Line
                }

            }
            else {

                Write-Host ""
                Write-Host "NO BRANCH PROPERTY FOUND"
            }

        }
        else {

            Write-Host ""
            Write-Host "ERROR: SONAR CONFIGURATION FILE NOT FOUND"
        }

        Write-Host ""
        Write-Host "======================================================"
        Write-Host "SONAR ENVIRONMENT VARIABLES"
        Write-Host "======================================================"

        Get-ChildItem Env: |
            Where-Object {
                $_.Name -match "SONAR|BUILD_SOURCEBRANCH|BUILD_SOURCEBRANCHNAME"
            } |
            Sort-Object Name |
            ForEach-Object {
                Write-Host "$($_.Name) = $($_.Value)"
            }

        Write-Host ""
        Write-Host "======================================================"

      displayName: DEBUG Sonar Generated Configuration


    # ====================================================
    # BUILD
    # ====================================================

    - task: DotNetCoreCLI@2

      displayName: Build Backend

      inputs:

        command: build

        projects: Backend/CST.LePoint.sln

        arguments: '--configuration $(BuildConfiguration) --no-restore'


    # ====================================================
    # TESTS + COVERAGE
    # ====================================================

    - powershell: |

        Write-Host "======================================================"
        Write-Host "RUN UNIT TESTS + COVERAGE"
        Write-Host "======================================================"

        dotnet test `
          "Backend/tests/CollectManagement.Tests/CollectManagement.Tests.csproj" `
          --configuration $(BuildConfiguration) `
          --no-build `
          --logger "trx;LogFileName=test-results.trx" `
          --results-directory "$(Build.SourcesDirectory)/TestResults" `
          --collect:"XPlat Code Coverage" `
          -- `
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

        $exitCode = $LASTEXITCODE

        Write-Host ""
        Write-Host "dotnet test exit code = $exitCode"

        if ($exitCode -ne 0) {

            Write-Host "UNIT TESTS FAILED"

            exit $exitCode
        }

        Write-Host ""
        Write-Host "UNIT TESTS + COVERAGE COMPLETED"

      displayName: Run Unit Tests + Coverage


    # ====================================================
    # CHECK TEST RESULTS
    # ====================================================

    - powershell: |

        Write-Host "======================================================"
        Write-Host "TRX FILES"
        Write-Host "======================================================"

        if (Test-Path "$(Build.SourcesDirectory)/TestResults") {

            $trxFiles = Get-ChildItem `
                "$(Build.SourcesDirectory)/TestResults" `
                -Recurse `
                -Filter *.trx `
                -ErrorAction SilentlyContinue

            if ($trxFiles) {

                $trxFiles | ForEach-Object {
                    Write-Host $_.FullName
                }

            }
            else {

                Write-Host "NO TRX FILE FOUND"
            }
        }

        Write-Host ""
        Write-Host "======================================================"
        Write-Host "OPENCOVER FILES"
        Write-Host "======================================================"

        if (Test-Path "$(Build.SourcesDirectory)/TestResults") {

            $coverageFiles = Get-ChildItem `
                "$(Build.SourcesDirectory)/TestResults" `
                -Recurse `
                -Filter coverage.opencover.xml `
                -ErrorAction SilentlyContinue

            if ($coverageFiles) {

                $coverageFiles | ForEach-Object {
                    Write-Host $_.FullName
                }

            }
            else {

                Write-Host "NO OPENCOVER FILE FOUND"
            }
        }

      displayName: Check Coverage Files

      condition: always()


    # ====================================================
    # PUBLISH TEST RESULTS
    # ====================================================

    - task: PublishTestResults@2

      displayName: Publish Tests

      condition: always()

      inputs:

        testResultsFormat: VSTest

        testResultsFiles: '**/*.trx'

        searchFolder: '$(Build.SourcesDirectory)/TestResults'

        failTaskOnFailedTests: false


    # ====================================================
    # SONAR ANALYZE
    # ====================================================

    - task: SonarQubeAnalyze@7

      displayName: Sonar Analyze


    # ====================================================
    # QUALITY GATE
    # ====================================================

    - task: SonarQubePublish@7

      displayName: Quality Gate

      inputs:

        pollingTimeoutSec: 300


    # ====================================================
    # PUBLISH API
    # ====================================================

    - task: DotNetCoreCLI@2

      displayName: Publish API

      inputs:

        command: publish

        projects: Backend/src/CollectManagement.ms/CollectManagement.WebAPI/CollectManagement.WebAPI.csproj

        arguments: '--configuration $(BuildConfiguration) --output $(Build.ArtifactStagingDirectory)/Backend'


    # ====================================================
    # BACKEND ARTIFACT
    # ====================================================

    - task: PublishBuildArtifacts@1

      displayName: Backend Artifact

      inputs:

        PathtoPublish: $(Build.ArtifactStagingDirectory)/Backend

        ArtifactName: backend


# ========================================================
# FRONTEND ANGULAR
# ========================================================

- stage: Frontend_Build

  displayName: Build Angular Frontend

  jobs:

  - job: Build_Angular

    displayName: Build Angular Application

    steps:

    # ====================================================
    # NODE 22
    # ====================================================

    - task: UseNode@1

      displayName: Install Node 22

      inputs:

        version: '22.x'


    # ====================================================
    # CLEAN NODE MODULES
    # ====================================================

    - powershell: |

        Set-Location Frontend

        if (Test-Path node_modules) {

            Write-Host "Removing node_modules..."

            Remove-Item `
                node_modules `
                -Recurse `
                -Force
        }

        Write-Host "Cleaning npm cache..."

        npm cache clean --force

      displayName: Clean Angular Dependencies


    # ====================================================
    # INSTALL
    # ====================================================

    - powershell: |

        Set-Location Frontend

        npm install --verbose

      displayName: Install Angular Packages


    # ====================================================
    # VERIFY ANGULAR
    # ====================================================

    - powershell: |

        Set-Location Frontend

        Write-Host "Angular packages:"
        npm list @angular/core

        Write-Host ""

        Write-Host "Angular builder:"
        npm list @angular-devkit/build-angular

      displayName: Verify Angular


    # ====================================================
    # BUILD ANGULAR
    # ====================================================

    - powershell: |

        Set-Location Frontend

        npm run build

      displayName: Build Angular


    # ====================================================
    # FRONTEND ARTIFACT
    # ====================================================

    - task: PublishBuildArtifacts@1

      displayName: Publish Frontend Artifact

      inputs:

        pathToPublish: Frontend/dist

        artifactName: frontend