
# ASP.NET Core (.NET 8)
# Build + Unit Tests + Coverage + SonarQube + Debug + Artifacts
# + Angular Frontend

trigger:
  - main

pool:
  name: AlertAgent1

variables:
  BuildConfiguration: 'Release'

stages:

# ========================================================
# BACKEND
# ========================================================

- stage: Backend
  displayName: 'Backend Build'

  jobs:
  - job: BuildBackend
    displayName: 'Build .NET Backend'

    steps:

    # ====================================================
    # CHECKOUT
    # ====================================================

    - checkout: self
      clean: true

    # ====================================================
    # JAVA 17
    # ====================================================

    - powershell: |
        $javaHome = "C:\Program Files\Eclipse Adoptium\jdk-17.0.20.8-hotspot"

        Write-Host "========================================"
        Write-Host "CONFIGURE JAVA 17"
        Write-Host "========================================"

        Write-Host "JAVA_HOME = $javaHome"

        Write-Host "##vso[task.setvariable variable=JAVA_HOME]$javaHome"
        Write-Host "##vso[task.prependpath]$javaHome\bin"

        Write-Host ""
        Write-Host "Java version:"
        java -version
      displayName: 'Configure Java 17'

    # ====================================================
    # .NET 8
    # ====================================================

    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    # ====================================================
    # ENVIRONMENT CHECK
    # ====================================================

    - powershell: |
        Write-Host "========================================"
        Write-Host "ENVIRONMENT CHECK"
        Write-Host "========================================"

        Write-Host ""
        Write-Host "JAVA_HOME:"
        Write-Host $env:JAVA_HOME

        Write-Host ""
        Write-Host "Java:"
        java -version

        Write-Host ""
        Write-Host ".NET:"
        dotnet --version

        Write-Host ""
        Write-Host "MSBuild:"
        dotnet --info
      displayName: 'Environment Check'

    # ====================================================
    # RESTORE
    # ====================================================

    - task: DotNetCoreCLI@2
      displayName: 'Restore Backend'
      inputs:
        command: 'restore'
        projects: 'Backend/CST.LePoint.sln'

    # ====================================================
    # SONARQUBE PREPARE
    # MAIN ONLY / NOT PULL REQUEST
    # ====================================================

    - task: SonarQubePrepare@7
      displayName: 'SonarQube Prepare'
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
      inputs:
        SonarQube: 'SonarQubeConnection'
        scannerMode: 'dotnet'
        projectKey: 'GestionAlarmePFE_GestionAlarmePFE_AaAfSd2rIVElcLDoHCE-'
        projectName: 'GestionAlarmePFE'
        extraProperties: |
          sonar.sourceEncoding=UTF-8
          sonar.exclusions=**/bin/**,**/obj/**,**/Migrations/**,**/TestResults/**
          sonar.cs.opencover.reportsPaths=$(Build.SourcesDirectory)/TestResults/**/coverage.opencover.xml
          sonar.cs.vstest.reportsPaths=$(Build.SourcesDirectory)/TestResults/**/*.trx

    # ====================================================
    # DEBUG SONARQUBE PREPARE
    # ====================================================

    - task: PowerShell@2
      displayName: 'DEBUG Sonar Properties After Prepare'
      condition: always()
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "========================================"
          Write-Host "SONARQUBE DEBUG - AFTER PREPARE"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Build.SourceBranch:"
          Write-Host "$(Build.SourceBranch)"

          Write-Host ""
          Write-Host "Build.SourceBranchName:"
          Write-Host "$(Build.SourceBranchName)"

          Write-Host ""
          Write-Host "Build.Reason:"
          Write-Host "$(Build.Reason)"

          Write-Host ""
          Write-Host "Build.BuildNumber:"
          Write-Host "$(Build.BuildNumber)"

          Write-Host ""
          Write-Host "Build.SourcesDirectory:"
          Write-Host "$(Build.SourcesDirectory)"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "CHECK .sonarqube DIRECTORY"
          Write-Host "========================================"

          $sonarDirectory = "$(Build.SourcesDirectory)\.sonarqube"

          if (Test-Path $sonarDirectory) {
              Write-Host ".sonarqube directory EXISTS."

              Get-ChildItem $sonarDirectory -Recurse -Force |
                Select-Object FullName
          }
          else {
              Write-Host "ERROR: .sonarqube directory NOT FOUND."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "CHECK sonar-project.properties"
          Write-Host "========================================"

          $propertiesFile = "$(Build.SourcesDirectory)\.sonarqube\out\sonar-project.properties"

          if (Test-Path $propertiesFile) {

              Write-Host "sonar-project.properties EXISTS."
              Write-Host ""

              Write-Host "========== FILE CONTENT =========="

              Get-Content $propertiesFile

              Write-Host ""
              Write-Host "========== BRANCH PROPERTY =========="

              $branchProperty = Select-String `
                -Path $propertiesFile `
                -Pattern "sonar.branch.name" `
                -SimpleMatch

              if ($branchProperty) {
                  Write-Host "FOUND sonar.branch.name:"
                  $branchProperty
              }
              else {
                  Write-Host "sonar.branch.name NOT FOUND in sonar-project.properties."
              }
          }
          else {
              Write-Host "ERROR: sonar-project.properties NOT FOUND."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "SEARCH sonar.branch.name IN .sonarqube"
          Write-Host "========================================"

          if (Test-Path $sonarDirectory) {

              $branchMatches = Get-ChildItem `
                $sonarDirectory `
                -Recurse `
                -File `
                -Force |
                Select-String `
                -Pattern "sonar.branch.name" `
                -SimpleMatch

              if ($branchMatches) {
                  Write-Host "FOUND sonar.branch.name somewhere in .sonarqube:"
                  $branchMatches
              }
              else {
                  Write-Host "No sonar.branch.name found in .sonarqube."
              }
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "SONAR ENVIRONMENT VARIABLES"
          Write-Host "========================================"

          Get-ChildItem Env: |
            Where-Object {
                $_.Name -match "SONAR|BRANCH|BUILD"
            } |
            Sort-Object Name |
            Format-Table -AutoSize

    # ====================================================
    # BUILD
    # ====================================================

    - task: DotNetCoreCLI@2
      displayName: 'Build Backend'
      inputs:
        command: 'build'
        projects: 'Backend/CST.LePoint.sln'
        arguments: '--configuration $(BuildConfiguration) --no-restore'

    # ====================================================
    # TESTS + COVERAGE
    # ====================================================

    - task: DotNetCoreCLI@2
      displayName: 'Run Unit Tests + Coverage'
      inputs:
        command: 'test'
        projects: 'Backend/tests/CollectManagement.Tests/CollectManagement.Tests.csproj'
        publishTestResults: false
        arguments: >
          --configuration $(BuildConfiguration)
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory "$(Build.SourcesDirectory)/TestResults"
          --collect:"XPlat Code Coverage"
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

    # ====================================================
    # DEBUG TEST / COVERAGE FILES
    # ====================================================

    - task: PowerShell@2
      displayName: 'DEBUG Test and Coverage Files'
      condition: always()
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "========================================"
          Write-Host "TEST AND COVERAGE DEBUG"
          Write-Host "========================================"

          $testResults = "$(Build.SourcesDirectory)\TestResults"

          Write-Host ""
          Write-Host "TestResults directory:"
          Write-Host $testResults

          Write-Host ""
          Write-Host "========================================"
          Write-Host "TRX FILES"
          Write-Host "========================================"

          if (Test-Path $testResults) {

              $trxFiles = Get-ChildItem `
                $testResults `
                -Recurse `
                -Filter *.trx `
                -File

              if ($trxFiles) {
                  $trxFiles |
                    Select-Object FullName, Length, LastWriteTime
              }
              else {
                  Write-Host "NO TRX FILE FOUND."
              }
          }
          else {
              Write-Host "ERROR: TestResults directory does not exist."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "OPENCOVER FILES"
          Write-Host "========================================"

          if (Test-Path $testResults) {

              $coverageFiles = Get-ChildItem `
                $testResults `
                -Recurse `
                -Filter coverage.opencover.xml `
                -File

              if ($coverageFiles) {
                  $coverageFiles |
                    Select-Object FullName, Length, LastWriteTime
              }
              else {
                  Write-Host "NO coverage.opencover.xml FOUND."
              }
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "ALL TESTRESULTS FILES"
          Write-Host "========================================"

          if (Test-Path $testResults) {
              Get-ChildItem $testResults -Recurse -File |
                Select-Object FullName
          }

    # ====================================================
    # PUBLISH TEST RESULTS
    # ====================================================

    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      condition: always()
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '**/*.trx'
        searchFolder: '$(Build.SourcesDirectory)/TestResults'
        failTaskOnFailedTests: false
        testRunTitle: 'GestionAlarmePFE Unit Tests'

    # ====================================================
    # PUBLISH CODE COVERAGE
    # ====================================================

    - task: PublishCodeCoverageResults@2
      displayName: 'Publish Code Coverage'
      condition: always()
      inputs:
        summaryFileLocation: '$(Build.SourcesDirectory)/TestResults/**/coverage.opencover.xml'
        failIfCoverageEmpty: false

    # ====================================================
    # DEBUG SONAR PROPERTIES BEFORE ANALYZE
    # ====================================================

    - task: PowerShell@2
      displayName: 'DEBUG Sonar Properties Before Analyze'
      condition: always()
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "========================================"
          Write-Host "SONARQUBE DEBUG - BEFORE ANALYZE"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "SourceBranch:"
          Write-Host "$(Build.SourceBranch)"

          Write-Host ""
          Write-Host "SourceBranchName:"
          Write-Host "$(Build.SourceBranchName)"

          Write-Host ""
          Write-Host "BuildReason:"
          Write-Host "$(Build.Reason)"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "SONAR PROJECT PROPERTIES"
          Write-Host "========================================"

          $propertiesFile = "$(Build.SourcesDirectory)\.sonarqube\out\sonar-project.properties"

          if (Test-Path $propertiesFile) {

              Write-Host "Properties file EXISTS:"
              Write-Host $propertiesFile

              Write-Host ""
              Write-Host "========== CONTENT =========="

              Get-Content $propertiesFile

              Write-Host ""
              Write-Host "========== sonar.branch.name =========="

              $branchProperty = Select-String `
                -Path $propertiesFile `
                -Pattern "sonar.branch.name" `
                -SimpleMatch

              if ($branchProperty) {
                  Write-Host "WARNING: sonar.branch.name FOUND:"
                  $branchProperty
              }
              else {
                  Write-Host "OK: sonar.branch.name NOT FOUND."
              }

          }
          else {
              Write-Host "ERROR: sonar-project.properties NOT FOUND."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "COVERAGE FILES BEFORE ANALYZE"
          Write-Host "========================================"

          $coveragePath = "$(Build.SourcesDirectory)\TestResults"

          if (Test-Path $coveragePath) {

              $coverageFiles = Get-ChildItem `
                $coveragePath `
                -Recurse `
                -Filter coverage.opencover.xml `
                -File

              if ($coverageFiles) {
                  $coverageFiles |
                    Select-Object FullName, Length, LastWriteTime
              }
              else {
                  Write-Host "NO COVERAGE FILE FOUND."
              }

          }
          else {
              Write-Host "TestResults directory does not exist."
          }

    # ====================================================
    # SONARQUBE ANALYZE
    # MAIN ONLY / NOT PULL REQUEST
    # ====================================================

    - task: SonarQubeAnalyze@7
      displayName: 'SonarQube Analyze'
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
      inputs:
        jdkversion: 'JAVA_HOME_17_X64'

    # ====================================================
    # SONARQUBE PUBLISH / QUALITY GATE
    # MAIN ONLY / NOT PULL REQUEST
    # ====================================================

    - task: SonarQubePublish@7
      displayName: 'SonarQube Publish / Quality Gate'
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
      inputs:
        pollingTimeoutSec: '300'

    # ====================================================
    # PUBLISH API
    # ====================================================

    - task: DotNetCoreCLI@2
      displayName: 'Publish API'
      inputs:
        command: 'publish'
        projects: 'Backend/src/CollectManagement.ms/CollectManagement.WebAPI/CollectManagement.WebAPI.csproj'
        arguments: '--configuration $(BuildConfiguration) --output $(Build.ArtifactStagingDirectory)/Backend'
        zipAfterPublish: false

    # ====================================================
    # BACKEND ARTIFACT
    # ====================================================

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Backend Artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/Backend'
        ArtifactName: 'backend'
        publishLocation: 'Container'


# ========================================================
# FRONTEND ANGULAR
# ========================================================

- stage: Frontend_Build
  displayName: 'Build Angular Frontend'

  jobs:
  - job: Build_Angular
    displayName: 'Build Angular Application'

    steps:

    # ====================================================
    # CHECKOUT
    # ====================================================

    - checkout: self
      clean: true

    # ====================================================
    # NODE 22
    # ====================================================

    - task: UseNode@1
      displayName: 'Install Node.js 22'
      inputs:
        version: '22.x'

    # ====================================================
    # NODE / NPM CHECK
    # ====================================================

    - powershell: |
        Write-Host "========================================"
        Write-Host "NODE / NPM"
        Write-Host "========================================"

        node --version
        npm --version
      displayName: 'Check Node and NPM'

    # ====================================================
    # CLEAN NODE MODULES
    # ====================================================

    - powershell: |
        Set-Location Frontend

        if (Test-Path node_modules) {
            Write-Host "Removing node_modules..."
            Remove-Item node_modules -Recurse -Force
        }

        Write-Host "Cleaning npm cache..."
        npm cache clean --force
      displayName: 'Clean Angular Dependencies'

    # ====================================================
    # INSTALL ANGULAR PACKAGES
    # ====================================================

    - powershell: |
        Set-Location Frontend

        npm install --verbose
      displayName: 'Install Angular Packages'

    # ====================================================
    # VERIFY ANGULAR BUILDER
    # ====================================================

    - powershell: |
        Set-Location Frontend

        Write-Host "Angular builder:"
        npm list @angular-devkit/build-angular
      displayName: 'Verify Angular Builder'

    # ====================================================
    # BUILD ANGULAR
    # ====================================================

    - powershell: |
        Set-Location Frontend

        npm run build
      displayName: 'Build Angular'

    # ====================================================
    # CHECK ANGULAR DIST
    # ====================================================

    - powershell: |
        Write-Host "========================================"
        Write-Host "ANGULAR DIST"
        Write-Host "========================================"

        if (Test-Path "Frontend/dist") {
            Write-Host "Frontend/dist EXISTS."

            Get-ChildItem "Frontend/dist" -Recurse |
              Select-Object FullName
        }
        else {
            Write-Error "Frontend/dist directory was not created."
        }
      displayName: 'Check Angular Build'

    # ====================================================
    # FRONTEND ARTIFACT
    # ====================================================

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Frontend Artifact'
      inputs:
        PathtoPublish: 'Frontend/dist'
        ArtifactName: 'frontend'
        publishLocation: 'Container'

