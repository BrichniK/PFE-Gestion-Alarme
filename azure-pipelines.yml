# ASP.NET Core (.NET 8)
# Build + Unit Tests + Coverage + SonarQube + Artifacts

trigger:
- main

pool:
  name: AlertAgent1

variables:
  BuildConfiguration: Release

stages:

# ========================================================
# BACKEND
# ========================================================

- stage: Backend

  displayName: Backend Build

  jobs:

  - job: BuildBackend

    displayName: Build .NET Backend

    steps:

    # ====================================================
    # CHECKOUT
    # ====================================================

    - checkout: self
      clean: true


    # ====================================================
    # JAVA 17
    # ====================================================

    - powershell: |

        $javaHome = "C:\Program Files\Eclipse Adoptium\jdk-17.0.20.8-hotspot"

        Write-Host "JAVA_HOME = $javaHome"

        Write-Host "##vso[task.setvariable variable=JAVA_HOME]$javaHome"

        Write-Host "##vso[task.prependpath]$javaHome\bin"

        java -version

      displayName: Configure Java 17


    # ====================================================
    # DOTNET 8
    # ====================================================

    - task: UseDotNet@2

      displayName: Install .NET 8 SDK

      inputs:
        packageType: sdk
        version: '8.x'


    # ====================================================
    # ENVIRONMENT CHECK
    # ====================================================

    - powershell: |

        Write-Host "=========================================="
        Write-Host "ENVIRONMENT"
        Write-Host "=========================================="

        Write-Host ""
        Write-Host "JAVA_HOME:"
        Write-Host $env:JAVA_HOME

        Write-Host ""
        Write-Host "JAVA VERSION:"
        java -version

        Write-Host ""
        Write-Host ".NET VERSION:"
        dotnet --version

        Write-Host ""
        Write-Host ".NET SDKs:"
        dotnet --list-sdks

      displayName: Environment Check


    # ====================================================
    # RESTORE
    # ====================================================

    - task: DotNetCoreCLI@2

      displayName: Restore Backend

      inputs:

        command: restore

        projects: 'Backend/CST.LePoint.sln'


    # ====================================================
    # SONAR BRANCH DIAGNOSTIC
    # ====================================================

    - powershell: |

        Write-Host "=========================================="
        Write-Host "SONAR BRANCH DIAGNOSTIC"
        Write-Host "=========================================="

        Write-Host ""
        Write-Host "Azure DevOps variables"
        Write-Host "------------------------------------------"

        Write-Host "BUILD_SOURCEBRANCH:"
        Write-Host "$env:BUILD_SOURCEBRANCH"

        Write-Host ""
        Write-Host "BUILD_SOURCEBRANCHNAME:"
        Write-Host "$env:BUILD_SOURCEBRANCHNAME"

        Write-Host ""
        Write-Host "BUILD_REASON:"
        Write-Host "$env:BUILD_REASON"

        Write-Host ""
        Write-Host "SYSTEM_PULLREQUEST_SOURCEBRANCH:"
        Write-Host "$env:SYSTEM_PULLREQUEST_SOURCEBRANCH"

        Write-Host ""
        Write-Host "SYSTEM_PULLREQUEST_TARGETBRANCH:"
        Write-Host "$env:SYSTEM_PULLREQUEST_TARGETBRANCH"


        Write-Host ""
        Write-Host "=========================================="
        Write-Host "SEARCH sonar.branch.name IN REPOSITORY"
        Write-Host "=========================================="

        $found = $false

        $files = Get-ChildItem `
          "$(Build.SourcesDirectory)" `
          -Recurse `
          -File `
          -ErrorAction SilentlyContinue

        foreach ($file in $files) {

            try {

                $matches = Select-String `
                  -Path $file.FullName `
                  -Pattern "sonar\.branch\.name" `
                  -ErrorAction SilentlyContinue

                if ($matches) {

                    $found = $true

                    foreach ($match in $matches) {

                        Write-Host ""
                        Write-Host "FOUND:"
                        Write-Host "File: $($match.Path)"
                        Write-Host "Line: $($match.LineNumber)"
                        Write-Host "Content: $($match.Line)"
                    }
                }

            }
            catch {
                # Ignore binary/unreadable files
            }
        }

        if (-not $found) {

            Write-Host ""
            Write-Host "NO sonar.branch.name FOUND IN REPOSITORY"

        }


        Write-Host ""
        Write-Host "=========================================="
        Write-Host "SONAR ENVIRONMENT VARIABLES"
        Write-Host "=========================================="

        $sonarVariables = Get-ChildItem Env: |
          Where-Object {
              $_.Name -match "SONAR"
          } |
          Sort-Object Name

        if ($sonarVariables) {

            $sonarVariables |
              Format-Table Name, Value -AutoSize

        }
        else {

            Write-Host "NO SONAR ENVIRONMENT VARIABLES FOUND"

        }


        Write-Host ""
        Write-Host "=========================================="
        Write-Host "DIAGNOSTIC FINISHED"
        Write-Host "=========================================="

      displayName: Diagnose Sonar Branch


    # ====================================================
    # SONARQUBE PREPARE
    # ====================================================

    - task: SonarQubePrepare@7

      displayName: SonarQube Prepare

      inputs:

        SonarQube: 'SonarQubeConnection'

        scannerMode: 'dotnet'

        projectKey: 'GestionAlarmePFE'

        projectName: 'GestionAlarmePFE'

        extraProperties: |

          sonar.sourceEncoding=UTF-8

          sonar.exclusions=**/bin/**,**/obj/**,**/Migrations/**,**/TestResults/**

          sonar.cs.opencover.reportsPaths=$(Build.SourcesDirectory)/TestResults/**/coverage.opencover.xml

          sonar.cs.vstest.reportsPaths=$(Build.SourcesDirectory)/TestResults/**/*.trx


    # ====================================================
    # BUILD
    # ====================================================

    - task: DotNetCoreCLI@2

      displayName: Build Backend

      inputs:

        command: build

        projects: 'Backend/CST.LePoint.sln'

        arguments: '--configuration $(BuildConfiguration) --no-restore'


    # ====================================================
    # TESTS + COVERAGE
    # ====================================================

    - powershell: |

        Write-Host "=========================================="
        Write-Host "RUN UNIT TESTS + COVERAGE"
        Write-Host "=========================================="

        $testProject = "Backend/tests/CollectManagement.Tests/CollectManagement.Tests.csproj"

        dotnet test `
          $testProject `
          --configuration $(BuildConfiguration) `
          --no-build `
          --logger "trx;LogFileName=test-results.trx" `
          --results-directory "$(Build.SourcesDirectory)/TestResults" `
          --collect:"XPlat Code Coverage" `
          -- `
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

        $exitCode = $LASTEXITCODE

        Write-Host ""
        Write-Host "dotnet test exit code = $exitCode"

        if ($exitCode -ne 0) {

            Write-Host ""
            Write-Host "=========================================="
            Write-Host "UNIT TESTS FAILED"
            Write-Host "=========================================="

            exit $exitCode
        }

        Write-Host ""
        Write-Host "=========================================="
        Write-Host "UNIT TESTS + COVERAGE COMPLETED"
        Write-Host "=========================================="

      displayName: Run Unit Tests + Coverage


    # ====================================================
    # CHECK TEST RESULTS
    # ====================================================

    - powershell: |

        Write-Host "=========================================="
        Write-Host "TRX FILES"
        Write-Host "=========================================="

        if (Test-Path "$(Build.SourcesDirectory)/TestResults") {

            $trxFiles = Get-ChildItem `
              "$(Build.SourcesDirectory)/TestResults" `
              -Recurse `
              -Filter "*.trx" `
              -ErrorAction SilentlyContinue

            if ($trxFiles) {

                foreach ($file in $trxFiles) {

                    Write-Host $file.FullName
                }

            }
            else {

                Write-Host "NO TRX FILE FOUND"

            }
        }


        Write-Host ""
        Write-Host "=========================================="
        Write-Host "OPENCOVER FILES"
        Write-Host "=========================================="

        if (Test-Path "$(Build.SourcesDirectory)/TestResults") {

            $coverageFiles = Get-ChildItem `
              "$(Build.SourcesDirectory)/TestResults" `
              -Recurse `
              -Filter "coverage.opencover.xml" `
              -ErrorAction SilentlyContinue

            if ($coverageFiles) {

                foreach ($file in $coverageFiles) {

                    Write-Host $file.FullName
                }

            }
            else {

                Write-Host "NO OPENCOVER FILE FOUND"

            }
        }


        Write-Host ""
        Write-Host "=========================================="
        Write-Host "ALL TEST RESULT FILES"
        Write-Host "=========================================="

        if (Test-Path "$(Build.SourcesDirectory)/TestResults") {

            Get-ChildItem `
              "$(Build.SourcesDirectory)/TestResults" `
              -Recurse `
              -ErrorAction SilentlyContinue

        }

      displayName: Check Coverage Files

      condition: always()


    # ====================================================
    # PUBLISH TEST RESULTS
    # ====================================================

    - task: PublishTestResults@2

      displayName: Publish Tests

      condition: always()

      inputs:

        testResultsFormat: VSTest

        testResultsFiles: '**/*.trx'

        searchFolder: '$(Build.SourcesDirectory)/TestResults'

        failTaskOnFailedTests: false


    # ====================================================
    # SONAR ANALYZE
    # ====================================================

    - task: SonarQubeAnalyze@7

      displayName: Sonar Analyze


    # ====================================================
    # SONAR QUALITY GATE
    # ====================================================

    - task: SonarQubePublish@7

      displayName: SonarQube Quality Gate

      inputs:

        pollingTimeoutSec: '300'


    # ====================================================
    # PUBLISH API
    # ====================================================

    - task: DotNetCoreCLI@2

      displayName: Publish API

      inputs:

        command: publish

        projects: 'Backend/src/CollectManagement.ms/CollectManagement.WebAPI/CollectManagement.WebAPI.csproj'

        arguments: '--configuration $(BuildConfiguration) --output $(Build.ArtifactStagingDirectory)/Backend'


    # ====================================================
    # BACKEND ARTIFACT
    # ====================================================

    - task: PublishBuildArtifacts@1

      displayName: Publish Backend Artifact

      inputs:

        PathtoPublish: '$(Build.ArtifactStagingDirectory)/Backend'

        ArtifactName: 'backend'


# ========================================================
# FRONTEND ANGULAR
# ========================================================

- stage: Frontend_Build

  displayName: Build Angular Frontend

  jobs:

  - job: Build_Angular

    displayName: Build Angular Application

    steps:


    # ====================================================
    # CHECKOUT
    # ====================================================

    - checkout: self
      clean: true


    # ====================================================
    # NODE 22
    # ====================================================

    - task: UseNode@1

      displayName: Install Node 22

      inputs:

        version: '22.x'


    # ====================================================
    # NODE ENVIRONMENT
    # ====================================================

    - powershell: |

        Write-Host "=========================================="
        Write-Host "NODE ENVIRONMENT"
        Write-Host "=========================================="

        node --version

        npm --version

      displayName: Node Environment Check


    # ====================================================
    # CLEAN NODE MODULES
    # ====================================================

    - powershell: |

        Set-Location Frontend

        if (Test-Path node_modules) {

            Write-Host "Removing node_modules..."

            Remove-Item `
              node_modules `
              -Recurse `
              -Force
        }

        Write-Host "Cleaning npm cache..."

        npm cache clean --force

      displayName: Clean Angular Dependencies


    # ====================================================
    # INSTALL ANGULAR PACKAGES
    # ====================================================

    - powershell: |

        Set-Location Frontend

        npm install --verbose

      displayName: Install Angular Packages


    # ====================================================
    # VERIFY ANGULAR
    # ====================================================

    - powershell: |

        Set-Location Frontend

        Write-Host "=========================================="
        Write-Host "ANGULAR CORE"
        Write-Host "=========================================="

        npm list @angular/core

        Write-Host ""
        Write-Host "=========================================="
        Write-Host "ANGULAR BUILD TOOL"
        Write-Host "=========================================="

        npm list @angular-devkit/build-angular

      displayName: Verify Angular


    # ====================================================
    # BUILD ANGULAR
    # ====================================================

    - powershell: |

        Set-Location Frontend

        npm run build

      displayName: Build Angular


    # ====================================================
    # FRONTEND ARTIFACT
    # ====================================================

    - task: PublishBuildArtifacts@1

      displayName: Publish Frontend Artifact

      inputs:

        pathToPublish: 'Frontend/dist'

        artifactName: 'frontend'