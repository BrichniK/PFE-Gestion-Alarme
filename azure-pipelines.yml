
# ========================================================
# ASP.NET CORE .NET 8
# Backend Build + Unit Tests + Coverage + SonarQube
# + Backend Artifact + Angular Frontend Artifact
# ========================================================

trigger:
  - main

pool:
  name: AlertAgent1

variables:
  BuildConfiguration: 'Release'

stages:

# ========================================================
# BACKEND
# ========================================================

- stage: Backend
  displayName: 'Backend Build'

  jobs:

  - job: BuildBackend
    displayName: 'Build .NET Backend'

    steps:

    # ====================================================
    # CHECKOUT
    # ====================================================

    - checkout: self
      clean: true
      fetchDepth: 0

    # ====================================================
    # JAVA 17
    # ====================================================

    - powershell: |
        $javaHome = "C:\Program Files\Eclipse Adoptium\jdk-17.0.20.8-hotspot"

        Write-Host "========================================"
        Write-Host "CONFIGURE JAVA 17"
        Write-Host "========================================"

        if (-not (Test-Path $javaHome)) {
            Write-Error "Java 17 not found at: $javaHome"
            exit 1
        }

        Write-Host "JAVA_HOME = $javaHome"

        Write-Host "##vso[task.setvariable variable=JAVA_HOME]$javaHome"
        Write-Host "##vso[task.prependpath]$javaHome\bin"

        Write-Host ""
        Write-Host "Java version:"
        java -version

      displayName: 'Configure Java 17'


    # ====================================================
    # .NET 8
    # ====================================================

    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'

      inputs:
        packageType: 'sdk'
        version: '8.x'


    # ====================================================
    # ENVIRONMENT CHECK
    # ====================================================

    - powershell: |

        Write-Host "========================================"
        Write-Host "ENVIRONMENT CHECK"
        Write-Host "========================================"

        Write-Host ""
        Write-Host "JAVA_HOME:"
        Write-Host $env:JAVA_HOME

        Write-Host ""
        Write-Host "Java:"
        java -version

        Write-Host ""
        Write-Host ".NET:"
        dotnet --version

        Write-Host ""
        Write-Host "Git:"
        git --version

      displayName: 'Environment Check'


    # ====================================================
    # SONARQUBE PREPARE
    #
    # IMPORTANT:
    # Ce projectKey est celui du pipeline qui fonctionne.
    # ====================================================

    - task: SonarQubePrepare@7
      displayName: 'SonarQube Prepare'

      inputs:
        SonarQube: 'SonarQubeConnection'

        scannerMode: 'dotnet'

        projectKey: 'GestionAlarmePFE_GestionAlarmePFE_AaAfSd2rIVElcLDoHCE-'

        projectName: 'GestionAlarmePFE'

        projectVersion: '1.0'

        extraProperties: |
          sonar.sourceEncoding=UTF-8

          sonar.exclusions=**/bin/**,**/obj/**,**/Migrations/**,**/TestResults/**

          sonar.cs.opencover.reportsPaths=$(Build.SourcesDirectory)/TestResults/**/coverage.opencover.xml

          sonar.cs.vstest.reportsPaths=$(Build.SourcesDirectory)/TestResults/**/*.trx


    # ====================================================
    # RESTORE
    # ====================================================

    - task: DotNetCoreCLI@2
      displayName: 'Restore Backend'

      inputs:
        command: 'restore'

        projects: 'Backend/CST.LePoint.sln'


    # ====================================================
    # BUILD
    # ====================================================

    - task: DotNetCoreCLI@2
      displayName: 'Build Backend'

      inputs:
        command: 'build'

        projects: 'Backend/CST.LePoint.sln'

        arguments: >
          --configuration $(BuildConfiguration)
          --no-restore


    # ====================================================
    # TESTS + COVERAGE
    # ====================================================

    - task: DotNetCoreCLI@2
      displayName: 'Run Unit Tests + Coverage'

      inputs:
        command: 'test'

        projects: 'Backend/tests/CollectManagement.Tests/CollectManagement.Tests.csproj'

        publishTestResults: false

        arguments: >
          --configuration $(BuildConfiguration)
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory "$(Build.SourcesDirectory)/TestResults"
          --collect:"XPlat Code Coverage"
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover


    # ====================================================
    # CHECK TEST RESULTS
    # ====================================================

    - powershell: |

        Write-Host "========================================"
        Write-Host "TEST / COVERAGE FILES"
        Write-Host "========================================"

        $testResults = "$(Build.SourcesDirectory)\TestResults"

        if (Test-Path $testResults) {

            Write-Host ""
            Write-Host "TRX FILES:"
            Write-Host "----------------------------------------"

            Get-ChildItem `
              $testResults `
              -Recurse `
              -Filter "*.trx" `
              -File |
              Select-Object FullName, Length, LastWriteTime


            Write-Host ""
            Write-Host "OPENCOVER FILES:"
            Write-Host "----------------------------------------"

            Get-ChildItem `
              $testResults `
              -Recurse `
              -Filter "coverage.opencover.xml" `
              -File |
              Select-Object FullName, Length, LastWriteTime

        }
        else {

            Write-Error "TestResults directory NOT FOUND."

        }

      displayName: 'Check Test and Coverage Files'


    # ====================================================
    # PUBLISH TEST RESULTS
    # ====================================================

    - task: PublishTestResults@2
      displayName: 'Publish Test Results'

      condition: always()

      inputs:
        testResultsFormat: 'VSTest'

        testResultsFiles: '**/*.trx'

        searchFolder: '$(Build.SourcesDirectory)/TestResults'

        failTaskOnFailedTests: false

        testRunTitle: 'GestionAlarmePFE Unit Tests'


    # ====================================================
    # PUBLISH CODE COVERAGE
    # ====================================================

    - task: PublishCodeCoverageResults@2
      displayName: 'Publish Code Coverage'

      condition: always()

      inputs:
        summaryFileLocation: '$(Build.SourcesDirectory)/TestResults/**/coverage.opencover.xml'

        failIfCoverageEmpty: false


    # ====================================================
    # SONARQUBE CHECK BEFORE ANALYZE
    # ====================================================

    - powershell: |

        Write-Host "========================================"
        Write-Host "SONARQUBE CHECK"
        Write-Host "========================================"

        Write-Host ""
        Write-Host "Branch:"
        Write-Host "$(Build.SourceBranch)"

        Write-Host ""
        Write-Host "Build Reason:"
        Write-Host "$(Build.Reason)"

        Write-Host ""
        Write-Host "JAVA_HOME:"
        Write-Host $env:JAVA_HOME

        Write-Host ""
        Write-Host "Java:"
        java -version

        Write-Host ""
        Write-Host "Searching .sonarqube..."

        $sonarPath = "$(Build.SourcesDirectory)\.sonarqube"

        if (Test-Path $sonarPath) {

            Write-Host ""
            Write-Host "OK: .sonarqube FOUND"
            Write-Host $sonarPath

            Get-ChildItem `
              $sonarPath `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue |
              Select-Object FullName

        }
        else {

            Write-Error ".sonarqube NOT FOUND"

        }

        Write-Host ""
        Write-Host "Coverage files:"

        $testResults = "$(Build.SourcesDirectory)\TestResults"

        if (Test-Path $testResults) {

            Get-ChildItem `
              $testResults `
              -Recurse `
              -Filter "coverage.opencover.xml" `
              -File |
              Select-Object FullName, Length

        }


    # ====================================================
    # SONARQUBE ANALYZE
    #
    # IMPORTANT:
    # PAS DE CONDITION SUR MAIN
    # PAS DE CONDITION SUR PullRequest
    #
    # Même configuration que le pipeline qui fonctionne.
    # ====================================================

    - task: SonarQubeAnalyze@7
      displayName: 'SonarQube Analyze'

      inputs:
        jdkversion: 'JAVA_HOME_17_X64'


    # ====================================================
    # SONARQUBE PUBLISH / QUALITY GATE
    # ====================================================

    - task: SonarQubePublish@7
      displayName: 'SonarQube Publish / Quality Gate'

      inputs:
        pollingTimeoutSec: '300'


    # ====================================================
    # PUBLISH API
    # ====================================================

    - task: DotNetCoreCLI@2
      displayName: 'Publish API'

      inputs:
        command: 'publish'

        projects: 'Backend/src/CollectManagement.ms/CollectManagement.WebAPI/CollectManagement.WebAPI.csproj'

        arguments: >
          --configuration $(BuildConfiguration)
          --output $(Build.ArtifactStagingDirectory)/Backend

        zipAfterPublish: false


    # ====================================================
    # BACKEND ARTIFACT
    # ====================================================

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Backend Artifact'

      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/Backend'

        ArtifactName: 'backend'

        publishLocation: 'Container'


# ========================================================
# FRONTEND ANGULAR
# ========================================================

- stage: Frontend_Build
  displayName: 'Build Angular Frontend'

  jobs:

  - job: Build_Angular
    displayName: 'Build Angular Application'

    steps:

    # ====================================================
    # CHECKOUT
    # ====================================================

    - checkout: self
      clean: true


    # ====================================================
    # NODE 22
    # ====================================================

    - task: UseNode@1
      displayName: 'Install Node.js 22'

      inputs:
        version: '22.x'


    # ====================================================
    # NODE / NPM CHECK
    # ====================================================

    - powershell: |

        Write-Host "========================================"
        Write-Host "NODE / NPM VERSION"
        Write-Host "========================================"

        node --version

        npm --version

      displayName: 'Check Node and NPM'


    # ====================================================
    # CLEAN NODE MODULES
    # ====================================================

    - powershell: |

        Set-Location Frontend

        if (Test-Path node_modules) {

            Write-Host "Removing node_modules..."

            Remove-Item node_modules -Recurse -Force

        }

        Write-Host "Cleaning npm cache..."

        npm cache clean --force

      displayName: 'Clean Angular Dependencies'


    # ====================================================
    # INSTALL ANGULAR PACKAGES
    # ====================================================

    - powershell: |

        Set-Location Frontend

        npm install --verbose

      displayName: 'Install Angular Packages'


    # ====================================================
    # VERIFY ANGULAR BUILDER
    # ====================================================

    - powershell: |

        Set-Location Frontend

        Write-Host "Angular builder:"

        npm list @angular-devkit/build-angular

      displayName: 'Verify Angular Builder'


    # ====================================================
    # BUILD ANGULAR
    # ====================================================

    - powershell: |

        Set-Location Frontend

        npm run build

      displayName: 'Build Angular'


    # ====================================================
    # CHECK ANGULAR DIST
    # ====================================================

    - powershell: |

        Write-Host "========================================"
        Write-Host "ANGULAR DIST"
        Write-Host "========================================"

        if (Test-Path "Frontend/dist") {

            Write-Host "Frontend/dist exists."

            Get-ChildItem "Frontend/dist" -Recurse

        }
        else {

            Write-Error "Frontend/dist directory was not created."

        }

      displayName: 'Check Angular Build'


    # ====================================================
    # FRONTEND ARTIFACT
    # ====================================================

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Frontend Artifact'

      inputs:
        PathtoPublish: 'Frontend/dist'

        ArtifactName: 'frontend'

        publishLocation: 'Container'
