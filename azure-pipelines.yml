# ASP.NET Core (.NET 8)
# Build + Unit Tests + Coverage + SonarCloud + Artifacts


trigger:
- main


pool:
  name: AlertAgent


variables:
  buildConfiguration: 'Release'



stages:



# =====================================================
# BACKEND
# =====================================================


- stage: Backend_Build

  displayName: Build Backend API


  jobs:


  - job: Build_API

    displayName: Build .NET Backend


    steps:



    # ==========================
    # INSTALL .NET 8
    # ==========================


    - task: UseDotNet@2

      displayName: Install .NET 8 SDK

      inputs:

        packageType: sdk

        version: '8.x'





    # ==========================
    # RESTORE
    # ==========================


    - task: DotNetCoreCLI@2

      displayName: Restore Backend

      inputs:

        command: restore

        projects: Backend/CST.LePoint.sln





    # ==========================
    # SONARCLOUD PREPARE
    # ==========================


    - task: SonarCloudPrepare@3

      displayName: Prepare SonarCloud


      inputs:


        SonarCloud: 'SonarCloudConnection'


        organization: 'khalilbrichni'


        scannerMode: 'dotnet'


        projectKey: 'khalilbrichni'


        extraProperties: |

          sonar.exclusions=**/bin/**,**/obj/**,**/Migrations/**,**/tests/**

          sonar.cs.opencover.reportsPaths=$(Agent.TempDirectory)/TestResults/**/coverage.opencover.xml





    # ==========================
    # BUILD BACKEND
    # ==========================


    - task: DotNetCoreCLI@2


      displayName: Build Backend


      inputs:


        command: build


        projects: Backend/CST.LePoint.sln


        arguments: '--configuration $(buildConfiguration)'





    # ==========================
    # DEBUG PATH PROJECTS
    # ==========================


    - powershell: |


        Write-Host "Current directory:"
        Get-Location


        Write-Host ""

        Write-Host "Repository content:"

        Get-ChildItem "$(Build.SourcesDirectory)"



        Write-Host ""

        Write-Host "Searching csproj files..."

        Get-ChildItem "$(Build.SourcesDirectory)" -Recurse -Filter "*.csproj" |
        Select-Object FullName


      displayName: Find Project Files





    # ==========================
    # UNIT TEST + COVERAGE
    # ==========================


    - powershell: |


        dotnet test "Backend/tests/CollectManagement.Tests/CollectManagement.Tests.csproj" `
          --configuration $(buildConfiguration) `
          --logger "trx" `
          --results-directory "$(Agent.TempDirectory)\TestResults" `
          --collect:"XPlat Code Coverage" `
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover


      displayName: Run Unit Tests + Coverage





    # ==========================
    # CHECK COVERAGE FILE
    # ==========================


    - powershell: |


        Write-Host "Searching coverage files..."


        Get-ChildItem "$(Agent.TempDirectory)" -Recurse `
        -Include coverage.opencover.xml,*.trx `
        -ErrorAction SilentlyContinue |
        Select-Object FullName


      displayName: Check Coverage Files





    # ==========================
    # TEST RESULTS
    # ==========================


    - task: PublishTestResults@2


      displayName: Publish Unit Test Results


      inputs:


        testResultsFormat: VSTest


        testResultsFiles: '**/*.trx'


        searchFolder: '$(Agent.TempDirectory)\TestResults'


        failTaskOnFailedTests: true





    # ==========================
    # COVERAGE
    # ==========================


    - task: PublishCodeCoverageResults@2


      displayName: Publish Code Coverage


      inputs:


        codeCoverageTool: Cobertura


        summaryFileLocation: '$(Agent.TempDirectory)\TestResults\**\coverage.opencover.xml'





    # ==========================
    # SONARCLOUD ANALYZE
    # ==========================


    - task: SonarCloudAnalyze@3


      displayName: Analyze with SonarCloud





    - task: SonarCloudPublish@3


      displayName: Publish SonarCloud Result


      inputs:


        pollingTimeoutSec: '300'





    # ==========================
    # PUBLISH API
    # ==========================


    - task: DotNetCoreCLI@2


      displayName: Publish API


      inputs:


        command: publish


        projects: Backend/src/CollectManagement.ms/CollectManagement.WebAPI/CollectManagement.WebAPI.csproj


        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'





    # ==========================
    # ARTIFACT BACKEND
    # ==========================


    - task: PublishBuildArtifacts@1


      displayName: Publish Backend Artifact


      inputs:


        pathToPublish: $(Build.ArtifactStagingDirectory)


        artifactName: backend







# =====================================================
# FRONTEND ANGULAR
# =====================================================


- stage: Frontend_Build

  displayName: Build Angular Frontend



  jobs:


  - job: Build_Angular


    displayName: Build Angular Application



    steps:



    # ==========================
    # NODE
    # ==========================


    - task: NodeTool@0


      displayName: Install Node 22


      inputs:


        versionSpec: '22.x'





    # ==========================
    # INSTALL
    # ==========================


    - script: |


        cd Frontend

        npm ci


      displayName: Install Angular Dependencies





    # ==========================
    # BUILD
    # ==========================


    - script: |


        cd Frontend

        npm run build


      displayName: Build Angular





    # ==========================
    # ARTIFACT FRONTEND
    # ==========================


    - task: PublishBuildArtifacts@1


      displayName: Publish Frontend Artifact


      inputs:


        pathToPublish: Frontend/dist


        artifactName: frontend