# ASP.NET Core (.NET 8)
# Build + Unit Tests + Coverage + SonarQube + Artifacts

trigger:
  - main

pool:
  name: AlertAgent1

variables:
  BuildConfiguration: 'Release'

stages:

# ========================================================
# BACKEND
# ========================================================

- stage: Backend
  displayName: 'Backend Build'

  jobs:
  - job: BuildBackend
    displayName: 'Build .NET Backend'

    steps:

    # ====================================================
    # CHECKOUT
    # ====================================================

    - checkout: self
      clean: true

    # ====================================================
    # JAVA 17
    # ====================================================

    - powershell: |
        $javaHome = "C:\Program Files\Eclipse Adoptium\jdk-17.0.20.8-hotspot"

        Write-Host "Configuring JAVA_HOME..."
        Write-Host "JAVA_HOME = $javaHome"

        Write-Host "##vso[task.setvariable variable=JAVA_HOME]$javaHome"
        Write-Host "##vso[task.prependpath]$javaHome\bin"

        Write-Host ""
        Write-Host "Java version:"
        java -version

      displayName: 'Configure Java 17'

    # ====================================================
    # .NET 8
    # ====================================================

    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    # ====================================================
    # ENVIRONMENT CHECK
    # ====================================================

    - powershell: |
        Write-Host "========================================"
        Write-Host "ENVIRONMENT CHECK"
        Write-Host "========================================"

        Write-Host ""
        Write-Host "JAVA_HOME:"
        Write-Host $env:JAVA_HOME

        Write-Host ""
        Write-Host "Java version:"
        java -version

        Write-Host ""
        Write-Host ".NET version:"
        dotnet --version

        Write-Host ""
        Write-Host "PowerShell:"
        $PSVersionTable.PSVersion

      displayName: 'Environment Check'

    # ====================================================
    # RESTORE
    # ====================================================

    - task: DotNetCoreCLI@2
      displayName: 'Restore Backend'
      inputs:
        command: 'restore'
        projects: 'Backend/CST.LePoint.sln'

    # ====================================================
    # SONARQUBE PREPARE
    # MAIN ONLY / NOT PULL REQUEST
    # ====================================================

    - task: SonarQubePrepare@7
      displayName: 'SonarQube Prepare'
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
      inputs:
        SonarQube: 'SonarQubeConnection'
        scannerMode: 'dotnet'
        projectKey: 'GestionAlarmePFE'
        projectName: 'GestionAlarmePFE'
        extraProperties: |
          sonar.sourceEncoding=UTF-8
          sonar.exclusions=**/bin/**,**/obj/**,**/Migrations/**,**/TestResults/**
          sonar.cs.opencover.reportsPaths=$(Build.SourcesDirectory)/TestResults/**/coverage.opencover.xml
          sonar.cs.vstest.reportsPaths=$(Build.SourcesDirectory)/TestResults/**/*.trx

    # ====================================================
    # SONAR DEBUG - AFTER PREPARE
    # ====================================================

    - powershell: |
        Write-Host "========================================"
        Write-Host "SONARQUBE DEBUG - AFTER PREPARE"
        Write-Host "========================================"

        $sonarDir = "$(Build.SourcesDirectory)\.sonarqube"

        Write-Host ""
        Write-Host "Sonar directory:"
        Write-Host $sonarDir

        if (Test-Path $sonarDir) {

            Write-Host ""
            Write-Host ".sonarqube directory EXISTS"

            Write-Host ""
            Write-Host "Searching for sonar.branch.name..."
            
            $files = Get-ChildItem $sonarDir -Recurse -File -ErrorAction SilentlyContinue

            foreach ($file in $files) {
                try {
                    $content = Get-Content $file.FullName -Raw -ErrorAction SilentlyContinue

                    if ($content -match "sonar\.branch\.name") {
                        Write-Host ""
                        Write-Host "========================================"
                        Write-Host "FOUND sonar.branch.name"
                        Write-Host "File:"
                        Write-Host $file.FullName
                        Write-Host "========================================"

                        $matches = Select-String `
                            -Path $file.FullName `
                            -Pattern "sonar\.branch\.name" `
                            -SimpleMatch `
                            -ErrorAction SilentlyContinue

                        if ($matches) {
                            $matches | ForEach-Object {
                                Write-Host $_.Line
                            }
                        }
                    }
                }
                catch {
                }
            }

        }
        else {
            Write-Host ".sonarqube directory NOT FOUND"
        }

        Write-Host ""
        Write-Host "========================================"
        Write-Host "AZURE DEVOPS BUILD VARIABLES"
        Write-Host "========================================"

        Write-Host "Build.SourceBranch = $(Build.SourceBranch)"
        Write-Host "Build.SourceBranchName = $(Build.SourceBranchName)"
        Write-Host "Build.Reason = $(Build.Reason)"
        Write-Host "Build.Repository.Name = $(Build.Repository.Name)"

      displayName: 'DEBUG SonarQube Branch Configuration'
      condition: always()

    # ====================================================
    # BUILD
    # ====================================================

    - task: DotNetCoreCLI@2
      displayName: 'Build Backend'
      inputs:
        command: 'build'
        projects: 'Backend/CST.LePoint.sln'
        arguments: '--configuration $(BuildConfiguration) --no-restore'

    # ====================================================
    # TESTS + COVERAGE
    # ====================================================

    - task: DotNetCoreCLI@2
      displayName: 'Run Unit Tests + Coverage'
      inputs:
        command: 'test'
        projects: 'Backend/tests/CollectManagement.Tests/CollectManagement.Tests.csproj'
        publishTestResults: false
        arguments: >
          --configuration $(BuildConfiguration)
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory "$(Build.SourcesDirectory)/TestResults"
          --collect:"XPlat Code Coverage"
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

    # ====================================================
    # CHECK TESTS AND COVERAGE
    # ====================================================

    - powershell: |
        Write-Host "========================================"
        Write-Host "TEST AND COVERAGE FILES"
        Write-Host "========================================"

        $testResults = "$(Build.SourcesDirectory)\TestResults"

        if (Test-Path $testResults) {

            Write-Host ""
            Write-Host "TRX files:"
            Get-ChildItem `
                $testResults `
                -Recurse `
                -Filter *.trx `
                -ErrorAction SilentlyContinue

            Write-Host ""
            Write-Host "OpenCover files:"
            Get-ChildItem `
                $testResults `
                -Recurse `
                -Filter coverage.opencover.xml `
                -ErrorAction SilentlyContinue

        }
        else {

            Write-Host ""
            Write-Host "WARNING: TestResults directory does not exist."

        }

      displayName: 'DEBUG Test and Coverage Files'
      condition: always()

    # ====================================================
    # DEBUG SONAR COVERAGE PATHS
    # ====================================================

    - powershell: |
        Write-Host "========================================"
        Write-Host "SONAR COVERAGE DEBUG"
        Write-Host "========================================"

        Write-Host ""
        Write-Host "Expected TRX:"
        Write-Host "$(Build.SourcesDirectory)\TestResults"

        Write-Host ""
        Write-Host "Searching entire source directory for TRX..."

        Get-ChildItem `
            "$(Build.SourcesDirectory)" `
            -Recurse `
            -Filter *.trx `
            -ErrorAction SilentlyContinue |
            ForEach-Object {
                Write-Host $_.FullName
            }

        Write-Host ""
        Write-Host "Searching entire source directory for OpenCover..."

        Get-ChildItem `
            "$(Build.SourcesDirectory)" `
            -Recurse `
            -Filter coverage.opencover.xml `
            -ErrorAction SilentlyContinue |
            ForEach-Object {
                Write-Host $_.FullName
            }

        Write-Host ""
        Write-Host "Searching agent temp directory for coverage..."

        Get-ChildItem `
            "$(Agent.TempDirectory)" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Where-Object {
                $_.Name -eq "coverage.opencover.xml" -or
                $_.Extension -eq ".trx"
            } |
            ForEach-Object {
                Write-Host $_.FullName
            }

      displayName: 'DEBUG Sonar Coverage Files'
      condition: always()

    # ====================================================
    # PUBLISH TEST RESULTS
    # ====================================================

    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      condition: always()
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '**/*.trx'
        searchFolder: '$(Build.SourcesDirectory)/TestResults'
        failTaskOnFailedTests: false
        testRunTitle: 'GestionAlarmePFE Unit Tests'

    # ====================================================
    # PUBLISH CODE COVERAGE
    # ====================================================

    - task: PublishCodeCoverageResults@2
      displayName: 'Publish Code Coverage'
      condition: always()
      inputs:
        summaryFileLocation: '$(Build.SourcesDirectory)/TestResults/**/coverage.opencover.xml'
        failIfCoverageEmpty: false

    # ====================================================
    # SONARQUBE DEBUG - BEFORE ANALYZE
    # ====================================================

    - powershell: |
        Write-Host "========================================"
        Write-Host "SONARQUBE DEBUG - BEFORE ANALYZE"
        Write-Host "========================================"

        $propertiesFile = "$(Build.SourcesDirectory)\.sonarqube\out\sonar-project.properties"

        Write-Host ""
        Write-Host "Properties file:"
        Write-Host $propertiesFile

        if (Test-Path $propertiesFile) {

            Write-Host ""
            Write-Host "sonar-project.properties EXISTS"

            Write-Host ""
            Write-Host "Relevant Sonar properties:"

            Get-Content $propertiesFile |
                Where-Object {
                    $_ -match "^sonar\.(projectKey|projectName|branch|sourceEncoding|cs\.)"
                } |
                ForEach-Object {
                    Write-Host $_
                }

            Write-Host ""
            Write-Host "========================================"
            Write-Host "CHECKING sonar.branch.name"
            Write-Host "========================================"

            $branchProperty = Get-Content $propertiesFile |
                Where-Object {
                    $_ -match "^sonar\.branch\.name="
                }

            if ($branchProperty) {
                Write-Host ""
                Write-Host "WARNING: sonar.branch.name IS PRESENT:"
                Write-Host $branchProperty
            }
            else {
                Write-Host ""
                Write-Host "OK: sonar.branch.name is NOT present."
            }

        }
        else {

            Write-Host ""
            Write-Host "ERROR: sonar-project.properties NOT FOUND."

        }

        Write-Host ""
        Write-Host "========================================"
        Write-Host "BUILD INFORMATION"
        Write-Host "========================================"

        Write-Host "SourceBranch:"
        Write-Host "$(Build.SourceBranch)"

        Write-Host ""
        Write-Host "SourceBranchName:"
        Write-Host "$(Build.SourceBranchName)"

        Write-Host ""
        Write-Host "BuildReason:"
        Write-Host "$(Build.Reason)"

      displayName: 'DEBUG Sonar Properties Before Analyze'
      condition: always()

    # ====================================================
    # SONARQUBE ANALYZE
    # ====================================================

    - task: SonarQubeAnalyze@7
      displayName: 'SonarQube Analyze'
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
      inputs:
        jdkversion: 'JAVA_HOME_17_X64'

    # ====================================================
    # SONARQUBE PUBLISH / QUALITY GATE
    # ====================================================

    - task: SonarQubePublish@7
      displayName: 'SonarQube Publish / Quality Gate'
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
      inputs:
        pollingTimeoutSec: '300'

    # ====================================================
    # PUBLISH API
    # ====================================================

    - task: DotNetCoreCLI@2
      displayName: 'Publish API'
      inputs:
        command: 'publish'
        projects: 'Backend/src/CollectManagement.ms/CollectManagement.WebAPI/CollectManagement.WebAPI.csproj'
        arguments: '--configuration $(BuildConfiguration) --output $(Build.ArtifactStagingDirectory)/Backend'
        zipAfterPublish: false

    # ====================================================
    # BACKEND ARTIFACT
    # ====================================================

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Backend Artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/Backend'
        ArtifactName: 'backend'
        publishLocation: 'Container'


# ========================================================
# FRONTEND ANGULAR
# ========================================================

- stage: Frontend_Build
  displayName: 'Build Angular Frontend'

  jobs:
  - job: Build_Angular
    displayName: 'Build Angular Application'

    steps:

    # ====================================================
    # CHECKOUT
    # ====================================================

    - checkout: self
      clean: true

    # ====================================================
    # NODE 22
    # ====================================================

    - task: UseNode@1
      displayName: 'Install Node.js 22'
      inputs:
        version: '22.x'

    # ====================================================
    # NODE / NPM CHECK
    # ====================================================

    - powershell: |
        Write-Host "========================================"
        Write-Host "NODE / NPM CHECK"
        Write-Host "========================================"

        node --version
        npm --version

      displayName: 'Check Node and NPM'

    # ====================================================
    # CLEAN ANGULAR DEPENDENCIES
    # ====================================================

    - powershell: |
        Set-Location Frontend

        Write-Host "Current directory:"
        Get-Location

        if (Test-Path node_modules) {
            Write-Host "Removing node_modules..."
            Remove-Item node_modules -Recurse -Force
        }

        Write-Host "Cleaning npm cache..."
        npm cache clean --force

      displayName: 'Clean Angular Dependencies'

    # ====================================================
    # INSTALL ANGULAR PACKAGES
    # ====================================================

    - powershell: |
        Set-Location Frontend

        Write-Host "Installing Angular packages..."
        npm install --verbose

      displayName: 'Install Angular Packages'

    # ====================================================
    # VERIFY ANGULAR
    # ====================================================

    - powershell: |
        Set-Location Frontend

        Write-Host "Angular version:"
        npx ng version

        Write-Host ""
        Write-Host "Angular builder:"
        npm list @angular-devkit/build-angular

      displayName: 'Verify Angular Installation'

    # ====================================================
    # BUILD ANGULAR
    # ====================================================

    - powershell: |
        Set-Location Frontend

        Write-Host "Building Angular application..."
        npm run build

      displayName: 'Build Angular'

    # ====================================================
    # CHECK ANGULAR DIST
    # ====================================================

    - powershell: |
        Write-Host "========================================"
        Write-Host "ANGULAR DIST CHECK"
        Write-Host "========================================"

        $dist = "$(Build.SourcesDirectory)\Frontend\dist"

        if (Test-Path $dist) {

            Write-Host ""
            Write-Host "Angular dist exists:"
            Write-Host $dist

            Write-Host ""
            Write-Host "Contents:"
            Get-ChildItem $dist -Recurse

        }
        else {

            Write-Error "Frontend/dist directory was not created."

        }

      displayName: 'Check Angular Build'

    # ====================================================
    # FRONTEND ARTIFACT
    # ====================================================

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Frontend Artifact'
      inputs:
        PathtoPublish: 'Frontend/dist'
        ArtifactName: 'frontend'
        publishLocation: 'Container'