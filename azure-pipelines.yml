# ASP.NET Core (.NET 8)
# Build + Unit Tests + Coverage + SonarQube + Artifacts

trigger:
- main

pool:
  name: AlertAgent1

variables:
  BuildConfiguration: Release

stages:

# ========================================================
# BACKEND
# ========================================================

- stage: Backend

  displayName: Backend Build

  jobs:

  - job: BuildBackend

    displayName: Build .NET Backend

    steps:

    # ====================================================
    # CHECKOUT
    # ====================================================

    - checkout: self
      clean: true


    # ====================================================
    # JAVA 17
    # ====================================================

    - powershell: |

        $javaHome="C:\Program Files\Eclipse Adoptium\jdk-17.0.20.8-hotspot"

        Write-Host "=========================================="
        Write-Host "CONFIGURE JAVA 17"
        Write-Host "=========================================="

        Write-Host "JAVA_HOME = $javaHome"

        Write-Host "##vso[task.setvariable variable=JAVA_HOME]$javaHome"

        Write-Host "##vso[task.setvariable variable=PATH]$javaHome\bin;$env:PATH"

        java -version

      displayName: Configure Java 17


    # ====================================================
    # DOTNET 8
    # ====================================================

    - task: UseDotNet@2

      displayName: Install .NET 8 SDK

      inputs:
        packageType: sdk
        version: 8.x


    # ====================================================
    # ENVIRONMENT CHECK
    # ====================================================

    - powershell: |

        Write-Host "=========================================="
        Write-Host "ENVIRONMENT CHECK"
        Write-Host "=========================================="

        Write-Host "JAVA_HOME:"
        echo $env:JAVA_HOME

        Write-Host ""
        Write-Host "JAVA VERSION:"
        java -version

        Write-Host ""
        Write-Host ".NET VERSION:"
        dotnet --version

        Write-Host ""
        Write-Host ".NET INFO:"
        dotnet --info

      displayName: Environment Check


    # ====================================================
    # RESTORE
    # ====================================================

    - task: DotNetCoreCLI@2

      displayName: Restore

      inputs:

        command: restore

        projects: Backend/CST.LePoint.sln


    # ====================================================
    # CHECK SONAR / BRANCH VARIABLES
    # ====================================================

    - powershell: |

        Write-Host "=========================================="
        Write-Host "SONAR / BRANCH VARIABLES"
        Write-Host "=========================================="

        Get-ChildItem Env: |
          Where-Object {
            $_.Name -match "SONAR|BUILD_SOURCE|BUILD_REPOSITORY|BRANCH"
          } |
          Sort-Object Name |
          Format-Table Name, Value -AutoSize

      displayName: Check Sonar and Branch Variables


    # ====================================================
    # SONARQUBE PREPARE
    # ====================================================

    - task: SonarQubePrepare@7

      displayName: SonarQube Prepare

      inputs:

        SonarQube: SonarQubeConnection

        scannerMode: dotnet

        projectKey: GestionAlarmePFE

        projectName: GestionAlarmePFE

        extraProperties: |

          sonar.sourceEncoding=UTF-8

          sonar.exclusions=**/bin/**,**/obj/**,**/Migrations/**,**/TestResults/**

          sonar.cs.opencover.reportsPaths=$(Build.SourcesDirectory)/TestResults/**/coverage.opencover.xml

          sonar.cs.vstest.reportsPaths=$(Build.SourcesDirectory)/TestResults/**/*.trx


    # ====================================================
    # BUILD
    # ====================================================

    - task: DotNetCoreCLI@2

      displayName: Build Backend

      inputs:

        command: build

        projects: Backend/CST.LePoint.sln

        arguments: '--configuration $(BuildConfiguration) --no-restore'


    # ====================================================
    # TESTS + COVERAGE
    # ====================================================

    - powershell: |

        Write-Host "=========================================="
        Write-Host "RUN UNIT TESTS + COVERAGE"
        Write-Host "=========================================="

        dotnet test `
          "Backend/tests/CollectManagement.Tests/CollectManagement.Tests.csproj" `
          --configuration $(BuildConfiguration) `
          --no-build `
          --logger "trx;LogFileName=test-results.trx" `
          --results-directory "$(Build.SourcesDirectory)/TestResults" `
          --collect:"XPlat Code Coverage" `
          -- `
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

        if ($LASTEXITCODE -ne 0) {

            Write-Host "=========================================="
            Write-Host "UNIT TESTS FAILED"
            Write-Host "Exit code: $LASTEXITCODE"
            Write-Host "=========================================="

            exit $LASTEXITCODE
        }

        Write-Host "=========================================="
        Write-Host "UNIT TESTS + COVERAGE COMPLETED"
        Write-Host "=========================================="

      displayName: Run Unit Tests + Coverage


    # ====================================================
    # CHECK TEST / COVERAGE FILES
    # ====================================================

    - powershell: |

        Write-Host "=========================================="
        Write-Host "TEST RESULTS DIRECTORY"
        Write-Host "=========================================="

        if (Test-Path "$(Build.SourcesDirectory)/TestResults") {

            Get-ChildItem `
              "$(Build.SourcesDirectory)/TestResults" `
              -Recurse

        }
        else {

            Write-Host "TestResults directory does not exist."

        }


        Write-Host ""
        Write-Host "=========================================="
        Write-Host "TRX FILES"
        Write-Host "=========================================="

        if (Test-Path "$(Build.SourcesDirectory)/TestResults") {

            Get-ChildItem `
              "$(Build.SourcesDirectory)/TestResults" `
              -Recurse `
              -Filter *.trx

        }


        Write-Host ""
        Write-Host "=========================================="
        Write-Host "COVERAGE FILES"
        Write-Host "=========================================="

        if (Test-Path "$(Build.SourcesDirectory)/TestResults") {

            Get-ChildItem `
              "$(Build.SourcesDirectory)/TestResults" `
              -Recurse `
              -Filter coverage.opencover.xml

        }

      displayName: Check Coverage

      condition: always()


    # ====================================================
    # PUBLISH TEST RESULTS
    # ====================================================

    - task: PublishTestResults@2

      displayName: Publish Tests

      condition: always()

      inputs:

        testResultsFormat: VSTest

        testResultsFiles: '**/*.trx'

        searchFolder: '$(Build.SourcesDirectory)/TestResults'


    # ====================================================
    # SONARQUBE ANALYZE
    # ====================================================

    - task: SonarQubeAnalyze@7

      displayName: Sonar Analyze


    # ====================================================
    # QUALITY GATE
    # ====================================================

    - task: SonarQubePublish@7

      displayName: Quality Gate

      inputs:

        pollingTimeoutSec: 300


    # ====================================================
    # PUBLISH API
    # ====================================================

    - task: DotNetCoreCLI@2

      displayName: Publish API

      inputs:

        command: publish

        projects: Backend/src/CollectManagement.ms/CollectManagement.WebAPI/CollectManagement.WebAPI.csproj

        arguments: '--configuration $(BuildConfiguration) --output $(Build.ArtifactStagingDirectory)/Backend'


    # ====================================================
    # BACKEND ARTIFACT
    # ====================================================

    - task: PublishBuildArtifacts@1

      displayName: Backend Artifact

      inputs:

        PathtoPublish: $(Build.ArtifactStagingDirectory)/Backend

        ArtifactName: backend


# ========================================================
# FRONTEND ANGULAR
# ========================================================

- stage: Frontend_Build

  displayName: Build Angular Frontend

  jobs:

  - job: Build_Angular

    displayName: Build Angular Application

    steps:


    # ====================================================
    # NODE 22
    # ====================================================

    - task: UseNode@1

      displayName: Install Node 22

      inputs:

        version: '22.x'


    # ====================================================
    # CLEAN NODE MODULES
    # ====================================================

    - powershell: |

        Write-Host "=========================================="
        Write-Host "CLEAN ANGULAR DEPENDENCIES"
        Write-Host "=========================================="

        cd Frontend

        if (Test-Path node_modules) {

            Write-Host "Removing node_modules..."

            Remove-Item node_modules -Recurse -Force

        }

        if (Test-Path package-lock.json) {

            Write-Host "Cleaning npm cache..."

            npm cache clean --force

        }

      displayName: Clean Angular Dependencies


    # ====================================================
    # INSTALL ANGULAR PACKAGES
    # ====================================================

    - powershell: |

        Write-Host "=========================================="
        Write-Host "INSTALL ANGULAR PACKAGES"
        Write-Host "=========================================="

        cd Frontend

        npm install --verbose

      displayName: Install Angular Packages


    # ====================================================
    # VERIFY ANGULAR BUILDER
    # ====================================================

    - powershell: |

        Write-Host "=========================================="
        Write-Host "VERIFY ANGULAR BUILDER"
        Write-Host "=========================================="

        cd Frontend

        npm list @angular-devkit/build-angular

      displayName: Verify Angular Builder


    # ====================================================
    # BUILD ANGULAR
    # ====================================================

    - powershell: |

        Write-Host "=========================================="
        Write-Host "BUILD ANGULAR"
        Write-Host "=========================================="

        cd Frontend

        npm run build

        if ($LASTEXITCODE -ne 0) {

            Write-Host "Angular build failed."

            exit $LASTEXITCODE
        }

        Write-Host "=========================================="
        Write-Host "ANGULAR BUILD COMPLETED"
        Write-Host "=========================================="

      displayName: Build Angular


    # ====================================================
    # FRONTEND ARTIFACT
    # ====================================================

    - task: PublishBuildArtifacts@1

      displayName: Publish Frontend Artifact

      inputs:

        pathToPublish: Frontend/dist

        artifactName: frontend