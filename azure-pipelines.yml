# ASP.NET Core (.NET Framework)
# Build and test ASP.NET Core projects targeting the full .NET Framework.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger:
- main

pool:
  name: AlertAgent

variables:
  buildConfiguration: 'Release'


stages:

# ==========================
# BACKEND
# ==========================

- stage: Backend_Build
  displayName: Build Backend API

  jobs:

  - job: Build_API

    steps:

    - task: UseDotNet@2
      displayName: Install .NET 8
      inputs:
        packageType: sdk
        version: '8.x'


    # ==========================
    # RESTORE
    # ==========================

    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: restore
        projects: Backend/CST.LePoint.sln



    # ==========================
    # SONARCLOUD PREPARE
    # ==========================

    - task: SonarCloudPrepare@3
      displayName: Prepare SonarCloud
      inputs:
        SonarCloud: 'SonarCloudConnection'
        organization: 'khalilbrichni'
        scannerMode: 'dotnet'
        projectKey: 'khalilbrichni'
        extraProperties: |
          sonar.exclusions=**/bin/**,**/obj/**,**/Migrations/**,**/node_modules/**,**/dist/**,../Frontend/**,**/*.ts,**/*.html,**/*.css
          sonar.coverage.exclusions=**/*Tests.cs,**/tests/**



    # ==========================
    # BUILD
    # ==========================

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: build
        projects: Backend/CST.LePoint.sln
        arguments: '--configuration $(buildConfiguration)'



    # ==========================
    # TEST + COVERAGE
    # ==========================

    - task: DotNetCoreCLI@2
      displayName: Run Unit Tests + Coverage
      inputs:
        command: test
        projects: Backend/tests/**/*.csproj
        arguments: >
          --configuration $(buildConfiguration)
          --collect:"XPlat Code Coverage"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura



    # ==========================
    # SONARCLOUD ANALYSIS
    # ==========================

    - task: SonarCloudAnalyze@3
      displayName: Analyze with SonarCloud



    - task: SonarCloudPublish@3
      displayName: Publish SonarCloud Result
      inputs:
        pollingTimeoutSec: '300'



    # ==========================
    # PUBLISH API
    # ==========================

    - task: DotNetCoreCLI@2
      displayName: Publish API
      inputs:
        command: publish
        projects: Backend/src/CollectManagement.ms/CollectManagement.WebAPI/CollectManagement.WebAPI.csproj
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'



    - task: PublishBuildArtifacts@1
      displayName: Publish Backend Artifact
      inputs:
        pathToPublish: $(Build.ArtifactStagingDirectory)
        artifactName: backend



# ==========================
# FRONTEND
# ==========================

- stage: Frontend_Build
  displayName: Build Angular

  jobs:

  - job: Build_Angular

    steps:

    - task: NodeTool@0
      displayName: Install Node 22
      inputs:
        versionSpec: '22.x'


    - script: |
        cd Frontend
        npm ci
      displayName: Install packages


    - script: |
        cd Frontend
        npm run build
      displayName: Build Angular


    - task: PublishBuildArtifacts@1
      displayName: Publish Frontend Artifact
      inputs:
        pathToPublish: Frontend/dist
        artifactName: frontend