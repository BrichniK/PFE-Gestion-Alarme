# ASP.NET Core (.NET 8)
# Build + Unit Tests + Coverage + SonarQube + Artifacts

trigger:
- main

pool:
  name: AlertAgent1

variables:
  BuildConfiguration: Release

stages:

# ========================================================
# BACKEND
# ========================================================

- stage: Backend

  displayName: Backend Build

  jobs:

  - job: BuildBackend

    displayName: Build .NET Backend

    steps:

    # ====================================================
    # CHECKOUT
    # ====================================================

    - checkout: self
      clean: true


    # ====================================================
    # JAVA 17
    # ====================================================

    - powershell: |

        $javaHome="C:\Program Files\Eclipse Adoptium\jdk-17.0.20.8-hotspot"

        Write-Host "JAVA_HOME = $javaHome"

        Write-Host "##vso[task.setvariable variable=JAVA_HOME]$javaHome"

        Write-Host "##vso[task.prependpath]$javaHome\bin"

        java -version

      displayName: Configure Java 17


    # ====================================================
    # DOTNET 8
    # ====================================================

    - task: UseDotNet@2

      displayName: Install .NET 8 SDK

      inputs:
        packageType: sdk
        version: 8.x


    # ====================================================
    # ENVIRONMENT CHECK
    # ====================================================

    - powershell: |

        Write-Host "=========================================="
        Write-Host "ENVIRONMENT"
        Write-Host "=========================================="

        Write-Host "JAVA_HOME:"
        Write-Host $env:JAVA_HOME

        Write-Host ""

        Write-Host "Java:"
        java -version

        Write-Host ""

        Write-Host ".NET:"
        dotnet --version

        Write-Host ""

        Write-Host "SDK LIST:"
        dotnet --list-sdks

      displayName: Environment Check


    # ====================================================
    # RESTORE
    # ====================================================

    - task: DotNetCoreCLI@2

      displayName: Restore

      inputs:

        command: restore

        projects: Backend/CST.LePoint.sln


    # ====================================================
    # REMOVE SONAR BRANCH VARIABLES
    # ====================================================

    - powershell: |

        Write-Host "=========================================="
        Write-Host "CHECK SONAR BRANCH CONFIGURATION"
        Write-Host "=========================================="

        Write-Host ""
        Write-Host "Azure DevOps branch variables:"
        Write-Host "BUILD_SOURCEBRANCH = $env:BUILD_SOURCEBRANCH"
        Write-Host "BUILD_SOURCEBRANCHNAME = $env:BUILD_SOURCEBRANCHNAME"
        Write-Host "BUILD_SOURCEVERSION = $env:BUILD_SOURCEVERSION"

        Write-Host ""
        Write-Host "Checking repository for sonar.branch.name..."

        $matches = Get-ChildItem `
          "$(Build.SourcesDirectory)" `
          -Recurse `
          -File `
          -ErrorAction SilentlyContinue |
          Select-String `
          -Pattern "sonar\.branch\.name" `
          -SimpleMatch:$false `
          -ErrorAction SilentlyContinue

        if ($matches) {

            Write-Host ""
            Write-Host "WARNING: sonar.branch.name FOUND:"
            Write-Host ""

            $matches | ForEach-Object {
                Write-Host "$($_.Path):$($_.LineNumber) $($_.Line)"
            }

            Write-Host ""
            Write-Host "Removing sonar.branch.name from sonar-project.properties if present..."

            $sonarFiles = Get-ChildItem `
              "$(Build.SourcesDirectory)" `
              -Recurse `
              -Filter "sonar-project.properties" `
              -File `
              -ErrorAction SilentlyContinue

            foreach ($file in $sonarFiles) {

                Write-Host "Processing: $($file.FullName)"

                $content = Get-Content $file.FullName

                $content = $content |
                  Where-Object {
                    $_ -notmatch '^\s*sonar\.branch\.name\s*='
                  }

                Set-Content `
                  -Path $file.FullName `
                  -Value $content `
                  -Encoding UTF8
            }
        }
        else {

            Write-Host "No sonar.branch.name found in repository."
        }

        Write-Host ""
        Write-Host "=========================================="
        Write-Host "SONAR BRANCH CONFIGURATION CHECK DONE"
        Write-Host "=========================================="

      displayName: Remove Sonar Branch Configuration


    # ====================================================
    # SONARQUBE PREPARE
    # ====================================================

    - task: SonarQubePrepare@7

      displayName: SonarQube Prepare

      inputs:

        SonarQube: SonarQubeConnection

        scannerMode: dotnet

        projectKey: GestionAlarmePFE

        projectName: GestionAlarmePFE

        extraProperties: |

          sonar.sourceEncoding=UTF-8

          sonar.exclusions=**/bin/**,**/obj/**,**/Migrations/**,**/TestResults/**

          sonar.cs.opencover.reportsPaths=$(Build.SourcesDirectory)/TestResults/**/coverage.opencover.xml

          sonar.cs.vstest.reportsPaths=$(Build.SourcesDirectory)/TestResults/**/*.trx


    # ====================================================
    # BUILD
    # ====================================================

    - task: DotNetCoreCLI@2

      displayName: Build Backend

      inputs:

        command: build

        projects: Backend/CST.LePoint.sln

        arguments: '--configuration $(BuildConfiguration) --no-restore'


    # ====================================================
    # TESTS + COVERAGE
    # ====================================================

    - powershell: |

        Write-Host "=========================================="
        Write-Host "RUN UNIT TESTS + COVERAGE"
        Write-Host "=========================================="

        dotnet test `
          "Backend/tests/CollectManagement.Tests/CollectManagement.Tests.csproj" `
          --configuration $(BuildConfiguration) `
          --no-build `
          --logger "trx;LogFileName=test-results.trx" `
          --results-directory "$(Build.SourcesDirectory)/TestResults" `
          --collect:"XPlat Code Coverage" `
          -- `
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

        $exitCode = $LASTEXITCODE

        Write-Host ""
        Write-Host "dotnet test exit code = $exitCode"

        if ($exitCode -ne 0) {

            Write-Host "=========================================="
            Write-Host "UNIT TESTS FAILED"
            Write-Host "=========================================="

            exit $exitCode
        }

        Write-Host ""
        Write-Host "=========================================="
        Write-Host "UNIT TESTS + COVERAGE COMPLETED"
        Write-Host "=========================================="

      displayName: Run Unit Tests + Coverage


    # ====================================================
    # CHECK TEST RESULTS
    # ====================================================

    - powershell: |

        Write-Host "=========================================="
        Write-Host "TRX FILES"
        Write-Host "=========================================="

        if (Test-Path "$(Build.SourcesDirectory)/TestResults") {

            Get-ChildItem `
              "$(Build.SourcesDirectory)/TestResults" `
              -Recurse `
              -Filter *.trx |
              ForEach-Object {
                  Write-Host $_.FullName
              }
        }

        Write-Host ""
        Write-Host "=========================================="
        Write-Host "OPENCOVER FILES"
        Write-Host "=========================================="

        if (Test-Path "$(Build.SourcesDirectory)/TestResults") {

            Get-ChildItem `
              "$(Build.SourcesDirectory)/TestResults" `
              -Recurse `
              -Filter coverage.opencover.xml |
              ForEach-Object {
                  Write-Host $_.FullName
              }
        }

        Write-Host ""
        Write-Host "=========================================="
        Write-Host "ALL TEST RESULT FILES"
        Write-Host "=========================================="

        Get-ChildItem `
          "$(Build.SourcesDirectory)/TestResults" `
          -Recurse `
          -ErrorAction SilentlyContinue

      displayName: Check Coverage Files

      condition: always()


    # ====================================================
    # PUBLISH TEST RESULTS
    # ====================================================

    - task: PublishTestResults@2

      displayName: Publish Tests

      condition: always()

      inputs:

        testResultsFormat: VSTest

        testResultsFiles: '**/*.trx'

        searchFolder: '$(Build.SourcesDirectory)/TestResults'

        failTaskOnFailedTests: false


    # ====================================================
    # SONAR ANALYZE
    # ====================================================

    - task: SonarQubeAnalyze@7

      displayName: Sonar Analyze


    # ====================================================
    # QUALITY GATE
    # ====================================================

    - task: SonarQubePublish@7

      displayName: Quality Gate

      inputs:

        pollingTimeoutSec: 300


    # ====================================================
    # PUBLISH API
    # ====================================================

    - task: DotNetCoreCLI@2

      displayName: Publish API

      inputs:

        command: publish

        projects: Backend/src/CollectManagement.ms/CollectManagement.WebAPI/CollectManagement.WebAPI.csproj

        arguments: '--configuration $(BuildConfiguration) --output $(Build.ArtifactStagingDirectory)/Backend'


    # ====================================================
    # BACKEND ARTIFACT
    # ====================================================

    - task: PublishBuildArtifacts@1

      displayName: Backend Artifact

      inputs:

        PathtoPublish: $(Build.ArtifactStagingDirectory)/Backend

        ArtifactName: backend


# ========================================================
# FRONTEND ANGULAR
# ========================================================

- stage: Frontend_Build

  displayName: Build Angular Frontend

  jobs:

  - job: Build_Angular

    displayName: Build Angular Application

    steps:


    # ====================================================
    # NODE 22
    # ====================================================

    - task: UseNode@1

      displayName: Install Node 22

      inputs:

        version: '22.x'


    # ====================================================
    # CLEAN NODE MODULES
    # ====================================================

    - powershell: |

        Set-Location Frontend

        if (Test-Path node_modules) {

            Write-Host "Removing node_modules..."

            Remove-Item `
              node_modules `
              -Recurse `
              -Force
        }

        Write-Host "Cleaning npm cache..."

        npm cache clean --force

      displayName: Clean Angular Dependencies


    # ====================================================
    # INSTALL
    # ====================================================

    - powershell: |

        Set-Location Frontend

        npm install --verbose

      displayName: Install Angular Packages


    # ====================================================
    # VERIFY ANGULAR
    # ====================================================

    - powershell: |

        Set-Location Frontend

        Write-Host "Angular packages:"

        npm list @angular/core

        Write-Host ""

        Write-Host "Angular builder:"

        npm list @angular-devkit/build-angular

      displayName: Verify Angular


    # ====================================================
    # BUILD ANGULAR
    # ====================================================

    - powershell: |

        Set-Location Frontend

        npm run build

      displayName: Build Angular


    # ====================================================
    # FRONTEND ARTIFACT
    # ====================================================

    - task: PublishBuildArtifacts@1

      displayName: Publish Frontend Artifact

      inputs:

        pathToPublish: Frontend/dist

        artifactName: frontend