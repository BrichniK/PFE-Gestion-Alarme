apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: gestionalarme

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:

      imagePullSecrets:
      - name: dockerhub-secret

      containers:
      - name: frontend

        image: brichnik/gestion-alarme-pfe:frontend-latest

        ports:
        - containerPort: 80