apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: gestionalarme-prod

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      imagePullSecrets:
        - name: dockerhub-secret

      containers:
        - name: backend
          image: brichnik/gestion-alarme-pfe:backend-latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          env:
            # Environnement ASP.NET Core
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"

            # Connexion SQL Server AKS
            - name: ConnectionStrings__SqlServerConnection
              valueFrom:
                secretKeyRef:
                  name: gestionalarme-secret
                  key: ConnectionStrings__SqlServerConnection

            # Configuration MQTT Kubernetes
            - name: Mqtt__Broker
              value: "mqtt-service"

            - name: Mqtt__Port
              value: "1883"

            - name: Mqtt__Username
              value: "admincst"

            - name: Mqtt__Password
              value: "Cst_2024*"

            - name: Mqtt__ClientId
              value: "CollectManagement-Client"

            - name: Mqtt__Topic
              value: "ALARME/+/+"