apiVersion: apps/v1
kind: Deployment

metadata:
  name: sqlserver
  namespace: gestionalarme-prod

spec:
  replicas: 1

  selector:
    matchLabels:
      app: sqlserver

  template:
    metadata:
      labels:
        app: sqlserver

    spec:

      initContainers:

      - name: volume-permissions

        image: busybox

        command:
        - sh
        - -c
        - |
          chown -R 10001:0 /var/opt/mssql

        volumeMounts:

        - name: sqlserver-storage
          mountPath: /var/opt/mssql


      containers:

      - name: sqlserver

        image: mcr.microsoft.com/mssql/server:2022-latest

        ports:

        - containerPort: 1433


        env:

        - name: ACCEPT_EULA
          value: "Y"


        - name: MSSQL_PID
          value: "Developer"


        - name: MSSQL_SA_PASSWORD

          valueFrom:

            secretKeyRef:

              name: gestionalarme-secret

              key: SA_PASSWORD


        volumeMounts:

        - name: sqlserver-storage

          mountPath: /var/opt/mssql



      volumes:

      - name: sqlserver-storage

        persistentVolumeClaim:

          claimName: sqlserver-pvc